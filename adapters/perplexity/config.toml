# Codex MCP profile: ThumbGate + Perplexity (copy into ~/.codex/config.toml or merge section)
# Includes support for Perplexity hybrid local-cloud inference (see HYBRID.md for Personal Computer / Computex 2026 orchestrator integration).
[mcp_servers.thumbgate]
command = "npx"
args = ["--yes", "--package", "thumbgate@1.32.0", "thumbgate", "serve"]

[mcp_servers.perplexity]
command = "npx"
args = ["-y", "@perplexity-ai/mcp-server"]

[mcp_servers.perplexity.env]
PERPLEXITY_API_KEY = "${PERPLEXITY_API_KEY}"

# Hard PreToolUse hook for Codex
[hooks.pre_tool_use]
command = "npx"
args = ["--yes", "--package", "thumbgate@1.32.0", "thumbgate", "gate-check"]

# For hybrid: when using Perplexity Personal Computer, add hybrid-routing gates
# via custom rules in ThumbGate config/gates/ for "cloud-escalation" on sensitive paths.
# See adapters/perplexity/HYBRID.md and model-candidates.json for perplexity/hybrid-* lanes.
