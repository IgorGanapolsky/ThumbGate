# Merge this block into ~/.config/poolside/settings.yaml.
# Pool exposes ThumbGate over MCP; keep Pool's own permissions and sandbox on,
# because Pool hooks are documented as fail-open and are not a security boundary.
pool:
    api_url: https://inference.poolside.ai
    auto_mode_classifier: poolside/laguna-xs-2.1
    worktree_prefix: feat-

tools:
    shell:
        deny:
            - "git log --all --grep *"
            - "git reflog *"
            - "gh pr review * --approve*"
            - "gh pr merge * --admin*"
            - "git push --force *"
            - "git push -f *"

mcp_servers:
    thumbgate:
        command: npx
        args:
            - --yes
            - --package
            - thumbgate@1.39.0
            - thumbgate
            - serve

subagents:
    default: general
    agents:
        fast_test_diff:
            type: in_process
            description: Laguna XS 2.1 fast subagent for single-file diffs, rapid test generation, and mechanical deprecations.
            instructions: Execute single-file edits or unit test generation with minimal latency without git reflog mining.
            inherit_agent_config: true
        security_auditor:
            type: in_process
            description: Audits diffs and trajectories for RL reward hacking, race conditions, and branch protection bypasses.
            instructions: Inspect diffs and shell commands for benchmark/reward hacking, race conditions, and security boundary violations.
            inherit_agent_config: true
