# Codex MCP profile: ThumbGate + Claw-style agents (Automation Anywhere EnterpriseClaw / Nvidia OpenShell)
# Copy into ~/.codex/config.toml or merge. See CLAW.md and adapters/perplexity/HYBRID.md for hybrid+claw synergy.
[mcp_servers.thumbgate]
command = "npx"
args = ["--yes", "--package", "thumbgate@1.35.0", "thumbgate", "serve"]

