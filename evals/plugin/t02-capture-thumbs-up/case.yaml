schema_version: "1.0"
name: "t02-capture-thumbs-up"
runs: 3
tags: [regression, tool-interface]
execution:
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Bash, Read]
  prompt: "The commit message you wrote for the login fix (\"fix: handle expired session tokens on login\") was exactly what I wanted. Log a thumbs up for it in ThumbGate."
graders:
  - name: "called-capture-feedback"
    type: tool_used
    tool: "mcp__plugin_thumbgate_thumbgate__capture_feedback"
  - name: "signal-is-up"
    type: regex
    target: mock_calls
    pattern: "\"signal\"\\s*:\\s*\"up\""
