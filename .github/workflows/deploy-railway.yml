name: Deploy to Railway

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-railway
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      THUMBGATE_API_KEY: ${{ secrets.THUMBGATE_API_KEY }}
      THUMBGATE_OPERATOR_KEY: ${{ secrets.THUMBGATE_OPERATOR_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      THUMBGATE_TRIAL_EMAIL_FROM: ${{ secrets.THUMBGATE_TRIAL_EMAIL_FROM || vars.THUMBGATE_TRIAL_EMAIL_FROM }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
      RAILWAY_HEALTHCHECK_URL: ${{ vars.RAILWAY_HEALTHCHECK_URL || 'https://thumbgate-production.up.railway.app/health' }}
      RAILWAY_HEALTHCHECK_MAX_ATTEMPTS: ${{ vars.RAILWAY_HEALTHCHECK_MAX_ATTEMPTS || '48' }}
      RAILWAY_HEALTHCHECK_SLEEP_SECONDS: ${{ vars.RAILWAY_HEALTHCHECK_SLEEP_SECONDS || '10' }}
      RAILWAY_HEALTHCHECK_CONNECT_TIMEOUT_SECONDS: ${{ vars.RAILWAY_HEALTHCHECK_CONNECT_TIMEOUT_SECONDS || '5' }}
      RAILWAY_HEALTHCHECK_MAX_TIME_SECONDS: ${{ vars.RAILWAY_HEALTHCHECK_MAX_TIME_SECONDS || '20' }}
      RAILWAY_LOG_LINES: ${{ vars.RAILWAY_LOG_LINES || '200' }}
      RAILWAY_HTTP_LOG_LINES: ${{ vars.RAILWAY_HTTP_LOG_LINES || '50' }}
      RAILWAY_SYNC_VARIABLES: ${{ vars.RAILWAY_SYNC_VARIABLES || 'false' }}
      RAILWAY_VARIABLE_SYNC_REQUIRED: ${{ vars.RAILWAY_VARIABLE_SYNC_REQUIRED || 'false' }}
      RAILWAY_VARIABLE_COMMAND_TIMEOUT_SECONDS: ${{ vars.RAILWAY_VARIABLE_COMMAND_TIMEOUT_SECONDS || '45' }}
      RAILWAY_VARIABLE_COMMAND_KILL_AFTER_SECONDS: ${{ vars.RAILWAY_VARIABLE_COMMAND_KILL_AFTER_SECONDS || '15' }}
      RAILWAY_DEPLOY_COMMAND_MAX_ATTEMPTS: ${{ vars.RAILWAY_DEPLOY_COMMAND_MAX_ATTEMPTS || '2' }}
      RAILWAY_DEPLOY_COMMAND_TIMEOUT_SECONDS: ${{ vars.RAILWAY_DEPLOY_COMMAND_TIMEOUT_SECONDS || '90' }}
      RAILWAY_DEPLOY_COMMAND_KILL_AFTER_SECONDS: ${{ vars.RAILWAY_DEPLOY_COMMAND_KILL_AFTER_SECONDS || '15' }}
      RAILWAY_POST_FAILURE_HEALTHCHECK_MAX_ATTEMPTS: ${{ vars.RAILWAY_POST_FAILURE_HEALTHCHECK_MAX_ATTEMPTS || '12' }}
      RAILWAY_POST_FAILURE_HEALTHCHECK_SLEEP_SECONDS: ${{ vars.RAILWAY_POST_FAILURE_HEALTHCHECK_SLEEP_SECONDS || '10' }}
      THUMBGATE_PUBLIC_APP_ORIGIN: ${{ vars.THUMBGATE_PUBLIC_APP_ORIGIN || 'https://thumbgate-production.up.railway.app' }}
      THUMBGATE_BILLING_API_BASE_URL: ${{ vars.THUMBGATE_BILLING_API_BASE_URL || vars.THUMBGATE_PUBLIC_APP_ORIGIN || 'https://thumbgate-production.up.railway.app' }}
      THUMBGATE_FEEDBACK_DIR: ${{ vars.THUMBGATE_FEEDBACK_DIR }}
      THUMBGATE_GA_MEASUREMENT_ID: ${{ vars.THUMBGATE_GA_MEASUREMENT_ID }}
      THUMBGATE_CHECKOUT_FALLBACK_URL: ${{ vars.THUMBGATE_CHECKOUT_FALLBACK_URL }}
      THUMBGATE_GOOGLE_SITE_VERIFICATION: ${{ vars.THUMBGATE_GOOGLE_SITE_VERIFICATION }}
      RAILWAY_TOKEN_ROTATED_AT: ${{ vars.RAILWAY_TOKEN_ROTATED_AT }}
      THUMBGATE_API_KEY_ROTATED_AT: ${{ vars.THUMBGATE_API_KEY_ROTATED_AT }}
      STRIPE_SECRET_KEY_ROTATED_AT: ${{ vars.STRIPE_SECRET_KEY_ROTATED_AT }}
      STRIPE_WEBHOOK_SECRET_ROTATED_AT: ${{ vars.STRIPE_WEBHOOK_SECRET_ROTATED_AT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # verify-npm-githead proves that the published npm gitHead is an
          # ancestor of this deploy SHA. A shallow checkout makes older release
          # commits unavailable and turns valid ancestry into fail-closed
          # "unknown", blocking every main deployment between npm releases.
          fetch-depth: 0
      - name: Detect deployable changes
        id: deploy-scope
        run: |
          BEFORE_SHA='${{ github.event.before }}' \
          HEAD_SHA="$GITHUB_SHA" \
          EVENT_NAME="$GITHUB_EVENT_NAME" \
          DEPLOY_SCOPE_OUTPUT_JSON='deploy-scope.json' \
          bash scripts/deploy-scope.sh
      - name: Upload deploy scope evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          retention-days: 7
          name: deploy-scope
          path: deploy-scope.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Check Railway deployment configuration
        id: railway-config
        run: |
          if [ "${{ steps.deploy-scope.outputs.should_deploy }}" != "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Railway deploy skipped: no runtime-serving files changed in this push range."
            exit 0
          fi

          missing_config=()
          [ -z "$RAILWAY_TOKEN" ] && missing_config+=('RAILWAY_TOKEN')
          [ -z "$RAILWAY_PROJECT_ID" ] && missing_config+=('RAILWAY_PROJECT_ID')
          [ -z "$RAILWAY_ENVIRONMENT_ID" ] && missing_config+=('RAILWAY_ENVIRONMENT_ID')
          [ -z "$RAILWAY_HEALTHCHECK_URL" ] && missing_config+=('RAILWAY_HEALTHCHECK_URL')

          if [ "${#missing_config[@]}" -gt 0 ]; then
            echo "::error::Railway deploy blocked: missing required deploy config: ${missing_config[*]}"
            exit 1
          fi

          missing_runtime_secrets=()
          [ -z "$THUMBGATE_API_KEY" ] && missing_runtime_secrets+=('THUMBGATE_API_KEY')

          if [ "${#missing_runtime_secrets[@]}" -gt 0 ]; then
            echo "::error::Railway deploy blocked: missing required runtime secrets: ${missing_runtime_secrets[*]}"
            exit 1
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - name: Enforce deploy policy
        if: steps.railway-config.outputs.enabled == 'true'
        run: node scripts/deploy-policy.js --profiles=billing,deploy
      - name: Verify deploy SHA owns the package version
        if: steps.railway-config.outputs.enabled == 'true'
        run: |
          node scripts/verify-npm-githead.js \
            --version="$(node -p "require('./package.json').version")" \
            --expected-sha="${GITHUB_SHA}" \
            --allow-unpublished \
            --json
      - name: Stamp immutable build metadata
        if: steps.railway-config.outputs.enabled == 'true'
        run: node scripts/build-metadata.js --sha "$GITHUB_SHA" --output config/build-metadata.json
      - name: Install Railway CLI
        if: steps.railway-config.outputs.enabled == 'true'
        run: |
          npm install -g @railway/cli
          railway --version || true
      - name: Set Railway environment variables
        if: steps.railway-config.outputs.enabled == 'true'
        run: |
          retry_railway() {
            local description="$1"
            shift
            local attempt=1
            local max_attempts=4
            local sleep_seconds=10
            local timeout_seconds="${RAILWAY_VARIABLE_COMMAND_TIMEOUT_SECONDS:-45}"
            local kill_after_seconds="${RAILWAY_VARIABLE_COMMAND_KILL_AFTER_SECONDS:-15}"

            until timeout --foreground --kill-after="${kill_after_seconds}s" "${timeout_seconds}s" "$@"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "Railway command failed after $attempt attempts: $description"
                return 1
              fi

              echo "Railway command failed (attempt $attempt/$max_attempts): $description"
              echo "Retrying in ${sleep_seconds}s..."
              sleep "$sleep_seconds"
              attempt=$((attempt + 1))
            done
          }

          SERVICE_ARGS=()
          if [ -n "$RAILWAY_SERVICE" ]; then
            SERVICE_ARGS+=(--service "$RAILWAY_SERVICE")
          fi

          if [ "$RAILWAY_SYNC_VARIABLES" != "true" ]; then
            echo "Railway variable sync skipped because RAILWAY_SYNC_VARIABLES is not true. Deploy will use existing Railway runtime variables and stamped build metadata."
            exit 0
          fi

          sync_railway_variables() {
            retry_railway "set THUMBGATE_API_KEY" railway variables set --skip-deploys THUMBGATE_API_KEY="$THUMBGATE_API_KEY" "${SERVICE_ARGS[@]}"
            retry_railway "set THUMBGATE_BUILD_SHA" railway variables set --skip-deploys THUMBGATE_BUILD_SHA="$GITHUB_SHA" "${SERVICE_ARGS[@]}"
            retry_railway "set THUMBGATE_BUILD_GENERATED_AT" railway variables set --skip-deploys THUMBGATE_BUILD_GENERATED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "${SERVICE_ARGS[@]}"
            retry_railway "set THUMBGATE_PUBLIC_APP_ORIGIN" railway variables set --skip-deploys THUMBGATE_PUBLIC_APP_ORIGIN="$THUMBGATE_PUBLIC_APP_ORIGIN" "${SERVICE_ARGS[@]}"
            retry_railway "set THUMBGATE_BILLING_API_BASE_URL" railway variables set --skip-deploys THUMBGATE_BILLING_API_BASE_URL="$THUMBGATE_BILLING_API_BASE_URL" "${SERVICE_ARGS[@]}"
            retry_railway "set STRIPE_SECRET_KEY" railway variables set --skip-deploys STRIPE_SECRET_KEY="$STRIPE_SECRET_KEY" "${SERVICE_ARGS[@]}"
            retry_railway "set STRIPE_WEBHOOK_SECRET" railway variables set --skip-deploys STRIPE_WEBHOOK_SECRET="$STRIPE_WEBHOOK_SECRET" "${SERVICE_ARGS[@]}"
            if [ -n "$RESEND_API_KEY" ]; then
              retry_railway "set RESEND_API_KEY" railway variables set --skip-deploys RESEND_API_KEY="$RESEND_API_KEY" "${SERVICE_ARGS[@]}"
            fi
            if [ -n "$THUMBGATE_TRIAL_EMAIL_FROM" ]; then
              retry_railway "set THUMBGATE_TRIAL_EMAIL_FROM" railway variables set --skip-deploys THUMBGATE_TRIAL_EMAIL_FROM="$THUMBGATE_TRIAL_EMAIL_FROM" "${SERVICE_ARGS[@]}"
            fi
            if [ -n "$THUMBGATE_FEEDBACK_DIR" ]; then
              retry_railway "set THUMBGATE_FEEDBACK_DIR" railway variables set --skip-deploys THUMBGATE_FEEDBACK_DIR="$THUMBGATE_FEEDBACK_DIR" "${SERVICE_ARGS[@]}"
            fi
            if [ -n "$THUMBGATE_GA_MEASUREMENT_ID" ]; then
              retry_railway "set THUMBGATE_GA_MEASUREMENT_ID" railway variables set --skip-deploys THUMBGATE_GA_MEASUREMENT_ID="$THUMBGATE_GA_MEASUREMENT_ID" "${SERVICE_ARGS[@]}"
            fi
            if [ -n "$THUMBGATE_CHECKOUT_FALLBACK_URL" ]; then
              retry_railway "set THUMBGATE_CHECKOUT_FALLBACK_URL" railway variables set --skip-deploys THUMBGATE_CHECKOUT_FALLBACK_URL="$THUMBGATE_CHECKOUT_FALLBACK_URL" "${SERVICE_ARGS[@]}"
            fi
            if [ -n "$THUMBGATE_GOOGLE_SITE_VERIFICATION" ]; then
              retry_railway "set THUMBGATE_GOOGLE_SITE_VERIFICATION" railway variables set --skip-deploys THUMBGATE_GOOGLE_SITE_VERIFICATION="$THUMBGATE_GOOGLE_SITE_VERIFICATION" "${SERVICE_ARGS[@]}"
            fi
          }

          if ! sync_railway_variables; then
            if [ "$RAILWAY_VARIABLE_SYNC_REQUIRED" = "true" ]; then
              echo "::error::Railway variable sync failed and RAILWAY_VARIABLE_SYNC_REQUIRED=true."
              exit 1
            fi
            echo "::warning::Railway variable sync failed after retries; continuing to deploy with existing Railway runtime variables. Health verification must still prove the new build."
          fi
      - name: Deploy to Railway
        id: railway-deploy
        if: steps.railway-config.outputs.enabled == 'true'
        timeout-minutes: 5
        run: |
          retry_railway() {
            local description="$1"
            shift
            local attempt=1
            local max_attempts="${RAILWAY_DEPLOY_COMMAND_MAX_ATTEMPTS:-2}"
            local sleep_seconds=15
            local timeout_seconds="${RAILWAY_DEPLOY_COMMAND_TIMEOUT_SECONDS:-90}"
            local kill_after_seconds="${RAILWAY_DEPLOY_COMMAND_KILL_AFTER_SECONDS:-15}"

            until timeout --foreground --kill-after="${kill_after_seconds}s" "${timeout_seconds}s" "$@"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "Railway command failed after $attempt attempts: $description"
                return 1
              fi

              echo "Railway command failed (attempt $attempt/$max_attempts): $description"
              echo "Retrying in ${sleep_seconds}s..."
              sleep "$sleep_seconds"
              attempt=$((attempt + 1))
            done
          }

          verify_live_build_sha_after_railway_failure() {
            local max_attempts="${RAILWAY_POST_FAILURE_HEALTHCHECK_MAX_ATTEMPTS:-12}"
            local sleep_seconds="${RAILWAY_POST_FAILURE_HEALTHCHECK_SLEEP_SECONDS:-10}"
            local connect_timeout_seconds="${RAILWAY_HEALTHCHECK_CONNECT_TIMEOUT_SECONDS:-5}"
            local max_time_seconds="${RAILWAY_HEALTHCHECK_MAX_TIME_SECONDS:-20}"
            local response_file
            local status=""
            local live_sha=""

            response_file="$(mktemp)"
            echo "Railway CLI reported a deploy failure; checking whether Railway already promoted $GITHUB_SHA..."
            for attempt in $(seq 1 "$max_attempts"); do
              status=$(curl --connect-timeout "$connect_timeout_seconds" --max-time "$max_time_seconds" -sS -o "$response_file" -w "%{http_code}" "$RAILWAY_HEALTHCHECK_URL" || true)
              echo "Post-failure promotion check $attempt/$max_attempts: $status"
              if [ "$status" = "200" ]; then
                live_sha=$(node -e "const fs = require('fs'); const data = JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); process.stdout.write(String(data.buildSha || ''));" "$response_file" || true)
                echo "Observed build SHA after Railway CLI failure: ${live_sha:-<missing>}"
                if [ "$live_sha" = "$GITHUB_SHA" ]; then
                  echo "Railway CLI failed after upload, but health verification proves $GITHUB_SHA is live."
                  rm -f "$response_file"
                  return 0
                fi
              fi
              if [ -s "$response_file" ]; then
                echo "Health response body:"
                sed -n '1,20p' "$response_file"
              fi
              if [ "$attempt" -lt "$max_attempts" ]; then
                sleep "$sleep_seconds"
              fi
            done

            echo "Railway CLI failure was not recoverable by health verification."
            echo "Final health status after Railway CLI failure: $status"
            echo "Expected build SHA: $GITHUB_SHA"
            echo "Observed build SHA after Railway CLI failure: ${live_sha:-<missing>}"
            rm -f "$response_file"
            return 1
          }

          SERVICE_ARGS=()
          if [ -n "$RAILWAY_SERVICE" ]; then
            SERVICE_ARGS+=(--service "$RAILWAY_SERVICE")
          fi
          # Use --detach to avoid "Failed to retrieve build log" streaming errors
          # (known Railway CLI issue). Health check step below verifies deployment.
          if ! retry_railway "deploy with railway up" railway up --ci --detach --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT_ID" "${SERVICE_ARGS[@]}"; then
            verify_live_build_sha_after_railway_failure
          fi
      - name: Verify deployment health
        if: steps.railway-config.outputs.enabled == 'true'
        timeout-minutes: 10
        run: |
          # Railway can briefly serve edge 502s after a successful promoted
          # build. Keep this longer than Railway's 300s default health window.
          MAX_ATTEMPTS="${RAILWAY_HEALTHCHECK_MAX_ATTEMPTS:-48}"
          SLEEP_SECONDS="${RAILWAY_HEALTHCHECK_SLEEP_SECONDS:-10}"
          CONNECT_TIMEOUT_SECONDS="${RAILWAY_HEALTHCHECK_CONNECT_TIMEOUT_SECONDS:-5}"
          MAX_TIME_SECONDS="${RAILWAY_HEALTHCHECK_MAX_TIME_SECONDS:-20}"
          STATUS=""
          RESPONSE_FILE="$(mktemp)"
          LIVE_SHA=""

          echo "Waiting for deploy to stabilise with up to $MAX_ATTEMPTS health checks and build SHA verification..."
          echo "Per-attempt probe budget: connect timeout ${CONNECT_TIMEOUT_SECONDS}s, max time ${MAX_TIME_SECONDS}s."
          for ATTEMPT in $(seq 1 "$MAX_ATTEMPTS"); do
            STATUS=$(curl --connect-timeout "$CONNECT_TIMEOUT_SECONDS" --max-time "$MAX_TIME_SECONDS" -sS -o "$RESPONSE_FILE" -w "%{http_code}" "$RAILWAY_HEALTHCHECK_URL" || true)
            echo "Health check attempt $ATTEMPT/$MAX_ATTEMPTS: $STATUS"
            if [ "$STATUS" = "200" ]; then
              LIVE_SHA=$(node -e "const fs = require('fs'); const data = JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); process.stdout.write(String(data.buildSha || ''));" "$RESPONSE_FILE" || true)
              echo "Observed build SHA: ${LIVE_SHA:-<missing>}"
              if [ "$LIVE_SHA" = "$GITHUB_SHA" ]; then
                break
              fi
            fi
            if [ -s "$RESPONSE_FILE" ]; then
              echo "Health response body:"
              sed -n '1,20p' "$RESPONSE_FILE"
            fi
            if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
              sleep "$SLEEP_SECONDS"
            fi
          done

          if [ "$STATUS" != "200" ] || [ "$LIVE_SHA" != "$GITHUB_SHA" ]; then
            echo "Deployment verification failed after $MAX_ATTEMPTS attempts"
            echo "Final health status: $STATUS"
            echo "Expected build SHA: $GITHUB_SHA"
            echo "Observed build SHA: ${LIVE_SHA:-<missing>}"
            exit 1
          fi
      - name: Verify authenticated production behavior
        if: steps.railway-config.outputs.enabled == 'true'
        timeout-minutes: 6
        run: |
          node scripts/prove-production-authenticated.js \
            --base-url="$THUMBGATE_PUBLIC_APP_ORIGIN" \
            --expected-version="$(node -p "require('./package.json').version")" \
            --expected-sha="$GITHUB_SHA" \
            --max-attempts=6 \
            --retry-delay-ms=10000 \
            --json
      # Between releases npm correctly has no package for this SHA (tag may
      # already exist on an older commit). Fail-closed on foreign ownership;
      # allow unpublished so content-only main deploys stay green. The earlier
      # pre-deploy ownership step already uses --allow-unpublished.
      - name: Verify deployed package ownership after publication
        if: steps.railway-config.outputs.enabled == 'true'
        timeout-minutes: 12
        run: |
          node scripts/verify-npm-githead.js \
            --version="$(node -p "require('./package.json').version")" \
            --expected-sha="$GITHUB_SHA" \
            --allow-unpublished \
            --max-attempts=60 \
            --retry-delay-ms=10000 \
            --json
      # Health prove is the hard deploy gate. Revenue/observability doctor is
      # advisory here so missing operator/analytics secrets do not paint a
      # successful Railway ship as a failed deploy (CEO: code live ≠ doctor ready).
      # Hard revenue truth remains in revenue-truth-audit.yml.
      - name: Verify revenue and buyer-path readiness
        id: revenue-readiness
        if: steps.railway-config.outputs.enabled == 'true'
        timeout-minutes: 3
        continue-on-error: true
        run: |
          SERVICE_ARGS=()
          if [ -n "$RAILWAY_SERVICE" ]; then
            SERVICE_ARGS+=(--service "$RAILWAY_SERVICE")
          fi

          set +e
          railway run \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            "${SERVICE_ARGS[@]}" \
            --no-local \
            -- node scripts/revenue-observability-doctor.js --json \
            > revenue-observability-doctor.json
          DOCTOR_EXIT=$?
          set -e

          if [ ! -s revenue-observability-doctor.json ]; then
            echo "::warning::Revenue observability doctor returned no JSON evidence (advisory)."
            echo "revenue_ready=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          cat revenue-observability-doctor.json
          node -e '
            const fs = require("fs");
            const report = JSON.parse(fs.readFileSync("revenue-observability-doctor.json", "utf8"));
            if (!report || !["ready", "degraded", "blocked"].includes(report.verdict)) {
              throw new Error("Revenue observability doctor emitted an invalid verdict");
            }
            if (report.globalRevenueClaimVerified !== false) {
              throw new Error("Configuration readiness must not be represented as verified global revenue");
            }
          '

          if [ "$DOCTOR_EXIT" -ne 0 ]; then
            echo "::warning::Revenue and buyer-path readiness is blocked (advisory; deploy health already verified)."
            echo "revenue_ready=false" >> "$GITHUB_OUTPUT"
            exit "$DOCTOR_EXIT"
          fi
          echo "revenue_ready=true" >> "$GITHUB_OUTPUT"
      - name: Upload revenue observability evidence
        if: always() && steps.railway-config.outputs.enabled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          retention-days: 7
          name: revenue-observability-${{ github.run_id }}
          path: revenue-observability-doctor.json
          if-no-files-found: warn
      - name: Verify public conversion surfaces
        id: public-conversion-surfaces
        if: always() && steps.railway-config.outputs.enabled == 'true'
        timeout-minutes: 5
        run: |
          set +e
          node scripts/verify-marketing-pages-deployed.js \
            --json \
            --prod-url="$THUMBGATE_PUBLIC_APP_ORIGIN" \
            > marketing-page-verification.json
          VERIFY_EXIT=$?
          set -e

          if [ ! -s marketing-page-verification.json ]; then
            echo "::error::Public conversion-surface verification returned no JSON evidence."
            exit 1
          fi

          cat marketing-page-verification.json
          node -e '
            const fs = require("fs");
            const report = JSON.parse(fs.readFileSync("marketing-page-verification.json", "utf8"));
            if (!report || !["pass", "fail"].includes(report.verdict)) {
              throw new Error("Public conversion-surface verifier emitted an invalid verdict");
            }
            if (!Number.isInteger(report.totalRoutes) || report.totalRoutes < 1) {
              throw new Error("Public conversion-surface verifier emitted no route coverage");
            }
          '

          if [ "$VERIFY_EXIT" -ne 0 ]; then
            echo "::error::Public conversion surfaces do not match the reviewed buyer-path contract."
            exit "$VERIFY_EXIT"
          fi
      - name: Upload public conversion-surface evidence
        if: always() && steps.railway-config.outputs.enabled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          retention-days: 7
          name: public-conversion-surfaces-${{ github.run_id }}
          path: marketing-page-verification.json
          if-no-files-found: warn
      - name: Capture Railway diagnostics
        if: failure() && steps.railway-config.outputs.enabled == 'true'
        continue-on-error: true
        run: bash scripts/capture-railway-diagnostics.sh railway-diagnostics
      - name: Upload Railway diagnostics artifact
        if: always() && steps.railway-config.outputs.enabled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          retention-days: 7
          name: railway-diagnostics-${{ github.run_id }}
          path: railway-diagnostics/
          if-no-files-found: warn
