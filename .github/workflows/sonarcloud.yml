name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  merge_group:
    branches: [main]
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: sonarcloud-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  sonar:
    name: SonarCloud Code Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect Sonar-relevant changes
        id: sonar-scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "scan=true" >> "$GITHUB_OUTPUT"
            echo "reason=full-analysis-event" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/sonar-changed-files.txt
          # Only scan files that still EXIST in the working tree; deleted files
          # are present in `git diff --name-only` output but the Sonar scanner
          # exits with "folder X does not exist" if we hand them over. Avoid a
          # pipeline (set -o pipefail + `while read` EOF returns 1, which the
          # `set -e` then propagates).
          awk '/^(src|scripts|bin)\// { print }' /tmp/sonar-changed-files.txt \
            > /tmp/sonar-changed-source-files-raw.txt
          : > /tmp/sonar-changed-source-files.txt
          while IFS= read -r f; do
            if [ -n "$f" ] && [ -e "$f" ]; then
              echo "$f" >> /tmp/sonar-changed-source-files.txt
            fi
          done < /tmp/sonar-changed-source-files-raw.txt
          if [[ -s /tmp/sonar-changed-source-files.txt ]]; then
            SOURCE_PATHS=$(paste -sd, /tmp/sonar-changed-source-files.txt)
          else
            SOURCE_PATHS="src,scripts,bin"
          fi
          echo "source_paths=$SOURCE_PATHS" >> "$GITHUB_OUTPUT"
          if grep -E '^(src/|scripts/|bin/|package(-lock)?\.json$|sonar-project\.properties$|\.github/workflows/sonarcloud\.yml$)' /tmp/sonar-changed-files.txt > /dev/null; then
            echo "scan=true" >> "$GITHUB_OUTPUT"
            echo "reason=sonar-surface-changed" >> "$GITHUB_OUTPUT"
          else
            echo "scan=false" >> "$GITHUB_OUTPUT"
            echo "reason=non-sonar-surface-only" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip SonarCloud scan for non-Sonar PR
        if: steps.sonar-scope.outputs.scan == 'false'
        run: |
          echo "No files in Sonar-scanned surfaces changed; required SonarCloud job exits successfully without scanner startup."

      - name: Skip SonarCloud scan for Dependabot PRs
        if: steps.sonar-scope.outputs.scan == 'true' && github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
        run: |
          echo "Dependabot pull requests do not receive SONAR_TOKEN-backed quality gate access; skipping SonarCloud and relying on CI plus CodeQL."

      - name: Setup Node
        if: steps.sonar-scope.outputs.scan == 'true' && !(github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]')
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            workers/package-lock.json

      - name: Cache SonarCloud packages
        if: steps.sonar-scope.outputs.scan == 'true' && !(github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]')
        uses: actions/cache@v5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Install deps
        if: steps.sonar-scope.outputs.scan == 'true' && !(github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]')
        run: npm ci --onnxruntime-node-install-cuda=skip

      - name: Generate LCOV coverage report
        if: steps.sonar-scope.outputs.scan == 'true' && !(github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]')
        run: |
          rm -rf .coverage coverage
          mkdir -p .coverage/raw
          NODE_V8_COVERAGE=.coverage/raw node scripts/test-coverage.js
          npx c8 report \
            --temp-directory .coverage/raw \
            --reports-dir coverage \
            --reporter=lcov \
            --reporter=text-summary \
            --include='.claude/**/*.js' \
            --include='adapters/**/*.js' \
            --include='bin/**/*.js' \
            --include='plugins/**/*.js' \
            --include='scripts/**/*.js' \
            --include='src/**/*.js' \
            --exclude='tests/**/*.js' \
            --exclude='scripts/social-reply-monitor.js'

      - name: Generate Python coverage report
        if: steps.sonar-scope.outputs.scan == 'true' && !(github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]')
        env:
          # The previous JS coverage step (`Generate LCOV coverage report`) creates
          # a `.coverage/raw` directory at repo root, which makes Python coverage's
          # default `.coverage` data-file path resolve to an existing *directory* —
          # `IsADirectoryError: [Errno 21]`. Park Python coverage's binary data
          # file under the per-run temp dir instead so the two languages never
          # collide on disk regardless of which step runs first.
          COVERAGE_FILE: ${{ runner.temp }}/python-coverage.data
        run: |
          python3 -m pip install coverage
          tmp_dir="$(mktemp -d)"
          feedback_log="$tmp_dir/feedback-log.jsonl"
          retrieval_log="$tmp_dir/retrieval.jsonl"
          lesson_db="$tmp_dir/lessons.sqlite"
          invalid_feedback_log="$tmp_dir/invalid-feedback-log.jsonl"
          reward_feedback_log="$tmp_dir/reward-feedback-log.jsonl"
          empty_lesson_db="$tmp_dir/empty-lessons.sqlite"
          feedback_dir="$tmp_dir/default-feedback-dir"
          report_path="$tmp_dir/report.md"

          python3 - <<'PY' "$feedback_log" "$retrieval_log" "$lesson_db" "$invalid_feedback_log" "$reward_feedback_log" "$empty_lesson_db" "$feedback_dir"
          import json
          import os
          import sqlite3
          import sys

          feedback_log, retrieval_log, lesson_db, invalid_feedback_log, reward_feedback_log, empty_lesson_db, feedback_dir = sys.argv[1:8]
          feedback_rows = [
              {"id": "fb_1", "signal": "negative", "context": "Agent repeated a git failure", "whatWentWrong": "Skipped branch check", "blocked": True, "tags": ["git"], "timestamp": "2026-05-12T12:00:00Z"},
              {"id": "fb_2", "signal": "positive", "context": "Agent verified tests before final", "allowed": True, "tags": ["testing"], "timestamp": "2026-05-12T12:03:00Z"},
              {"id": "fb_3", "signal": "negative", "context": "Agent skipped repro test", "allowed": True, "tags": ["testing"], "timestamp": "2026-05-12T12:06:00Z"},
              {"id": "fb_4", "signal": "positive", "context": "Agent wrote a complete report", "allowed": True, "tags": ["reporting"], "timestamp": "2026-05-12T12:09:00Z"},
          ]
          retrieval_rows = [
              {"queryFeedbackId": "fb_1", "matchedFeedbackId": "old_1", "score": 0.92, "matchedSignal": "negative"},
              {"queryFeedbackId": "fb_1", "matchedFeedbackId": "old_2", "score": 0.71, "matchedSignal": "negative"},
              {"queryFeedbackId": "fb_2", "matchedFeedbackId": "old_3", "score": 0.64, "matchedSignal": "positive"},
          ]
          with open(feedback_log, "w", encoding="utf-8") as handle:
              for row in feedback_rows:
                  handle.write(json.dumps(row) + "\n")
          with open(retrieval_log, "w", encoding="utf-8") as handle:
              for row in retrieval_rows:
                  handle.write(json.dumps(row) + "\n")
          with open(invalid_feedback_log, "w", encoding="utf-8") as handle:
              handle.write("{not-json}\n")
              handle.write(json.dumps(["not", "an", "object"]) + "\n")
              handle.write("\n")
              handle.write(json.dumps({"id": "fb_bad_ts", "signal": "up", "context": {"nested": "debug crash"}, "tags": [], "timestamp": "not-a-date"}) + "\n")
          with open(reward_feedback_log, "w", encoding="utf-8") as handle:
              handle.write(json.dumps({"id": "reward_pos", "reward": 1, "context": ["search", "found"], "richContext": {"domain": "research"}, "gateDecision": "accepted"}) + "\n")
              handle.write(json.dumps({"id": "reward_neg", "reward": -1, "context": "secret leaked", "decision": "deny", "failureType": "security", "tags": ["security"]}) + "\n")
          os.makedirs(feedback_dir, exist_ok=True)
          with open(os.path.join(feedback_dir, "feedback-log.jsonl"), "w", encoding="utf-8") as handle:
              handle.write(json.dumps({"id": "default_1", "signal": "thumbs_down", "context": "rm command allowed", "actionType": "no-action", "tags": ["shell"]}) + "\n")
          db = sqlite3.connect(lesson_db)
          db.executescript("""
          CREATE TABLE lessons (
            id TEXT PRIMARY KEY,
            signal TEXT NOT NULL,
            context TEXT,
            whatWentWrong TEXT,
            whatToChange TEXT,
            whatWorked TEXT,
            domain TEXT,
            tags TEXT,
            rootCause TEXT,
            importance TEXT DEFAULT 'medium',
            skill TEXT,
            timestamp TEXT NOT NULL,
            sourceFeedbackId TEXT,
            pruned INTEGER DEFAULT 0
          );
          INSERT INTO lessons (id, signal, context, domain, tags, timestamp, sourceFeedbackId, pruned)
          VALUES
            ('lesson_1', 'negative', 'git force push failed', 'git', '["git"]', '2026-05-12T12:00:00Z', 'fb_1', 0),
            ('lesson_2', 'positive', 'tests verified', 'testing', '["testing"]', '2026-05-12T12:03:00Z', 'fb_2', 0);
          """)
          db.commit()
          db.close()
          sqlite3.connect(empty_lesson_db).close()
          PY

          python3 -m coverage run --branch --source=scripts scripts/feedback_quality_eval.py \
            --feedback-log "$feedback_log" \
            --lesson-db "$lesson_db" \
            --retrieval-log "$retrieval_log" \
            --write-report "$report_path" \
            --json > "$tmp_dir/report.json"
          python3 -m coverage run --append --branch --source=scripts scripts/feedback_quality_eval.py \
            --feedback-log "$invalid_feedback_log" \
            --lesson-db "$empty_lesson_db" \
            --min-support 1 > "$tmp_dir/invalid-report.md"
          python3 -m coverage run --append --branch --source=scripts scripts/feedback_quality_eval.py \
            --feedback-log "$reward_feedback_log" \
            --lesson-db "$tmp_dir/missing-lessons.sqlite" \
            --json > "$tmp_dir/reward-report.json"
          THUMBGATE_FEEDBACK_DIR="$feedback_dir" python3 -m coverage run --append --branch --source=scripts scripts/feedback_quality_eval.py \
            --json > "$tmp_dir/default-report.json"
          python3 -m coverage run --append --branch --source=scripts scripts/feedback_quality_eval.py \
            --feedback-log "$tmp_dir/missing-feedback-log.jsonl" \
            --json > "$tmp_dir/missing-report.json"
          python3 -m coverage xml -o coverage/python-coverage.xml

      - name: Read package version
        id: package-version
        if: steps.sonar-scope.outputs.scan == 'true' && !(github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]')
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Sonar mainline analysis version
        id: sonar-mainline-version
        if: steps.sonar-scope.outputs.scan == 'true' && !(github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]')
        run: |
          SHORT_SHA=$(printf '%s' "$GITHUB_SHA" | cut -c1-12)
          echo "value=${{ steps.package-version.outputs.version }}+sha.$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Run SonarCloud scan (pull request / merge queue)
        if: steps.sonar-scope.outputs.scan == 'true' && !(github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]') && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
        uses: SonarSource/sonarqube-scan-action@v8.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectVersion=${{ steps.package-version.outputs.version }}
            -Dsonar.sources=${{ steps.sonar-scope.outputs.source_paths }}

      - name: Auto-review pre-approved SonarCloud hotspots
        if: steps.sonar-scope.outputs.scan == 'true' && !(github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]') && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: IgorGanapolsky_ThumbGate
          SONAR_PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          # Wait briefly for SonarCloud to finish background ingestion of the
          # analysis report uploaded by the previous step; hotspots only appear
          # in /api/hotspots/search once ingestion completes.
          sleep 30
          node scripts/sonar-review-hotspots.js
          # Hotspot status changes are asynchronous on SonarCloud; give the
          # quality gate a short window to observe the reviewed state.
          sleep 30

      - name: Check SonarCloud quality gate
        if: steps.sonar-scope.outputs.scan == 'true' && !(github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]') && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Run SonarCloud scan (default branch refresh)
        if: steps.sonar-scope.outputs.scan == 'true' && !(github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        # PR and merge-queue scans are the blocking quality gate. The mainline
        # refresh used to call the external scanner again on main, but that made
        # already-verified merges depend on scanner downloads/service health a
        # second time. Keep the main workflow green and rely on the required
        # PR/merge-queue scan above for enforcement. This is an explicit
        # tradeoff: SonarCloud default-branch baselines can lag until the next
        # full scanner run, so this step is intentionally informational instead
        # of a quality gate.
        run: |
          echo "::notice::Skipping default-branch Sonar scanner refresh; PR and merge-queue scans are the blocking quality gate. Default-branch baseline may lag until a full scanner run."
          echo "mainline_version=${{ steps.sonar-mainline-version.outputs.value }}"
