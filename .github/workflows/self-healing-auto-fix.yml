name: Self-Healing Auto-Fix

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci --onnxruntime-node-install-cuda=skip

      - name: Run self-heal
        run: node scripts/self-heal.js --reason=scheduled-auto-fix > self_heal_report.json || true

      - name: Open remediation PR
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "No auto-fix changes."
            exit 0
          fi

          BRANCH="auto/self-heal-fix-${{ github.run_id }}-${{ github.run_attempt }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "fix(auto): scheduled self-healing remediation" || true
          git push origin "$BRANCH"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "fix(auto): scheduled self-healing remediation" \
            --body "Automated self-healing remediation PR generated by workflow." \
            --label self-healing || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: self-healing-auto-fix-report
          path: self_heal_report.json
          retention-days: 14
