name: Stripe Checkout Diagnostic
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-stripe-checkout-diagnostic.yml'
      - 'scripts/stripe-checkout-diagnostic.js'
      - 'scripts/stripe-live-status.js'
      - 'scripts/billing.js'
      - 'src/api/server.js'
      - 'tests/stripe-checkout-diagnostic.test.js'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci --no-audit --no-fund
      - name: Run stripe-checkout-diagnostic
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: |
          mkdir -p reports/revenue
          node scripts/stripe-checkout-diagnostic.js | tee reports/revenue/stripe-checkout-diagnostic.md
          node scripts/stripe-checkout-diagnostic.js --json > reports/revenue/stripe-checkout-diagnostic.json
      - name: Upload diagnostic artifacts
        uses: actions/upload-artifact@v7
        with:
          name: stripe-checkout-diagnostic-${{ github.run_id }}
          path: reports/revenue/
          retention-days: 14
