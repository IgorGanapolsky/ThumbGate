name: Stripe Checkout Diagnostic
on:
  push:
    branches: [audit/stripe-checkout-diagnostic-2026-05-19]
    paths:
      - '.github/workflows/audit-stripe-checkout-diagnostic.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci --no-audit --no-fund
      - name: Run stripe-checkout-diagnostic
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: node scripts/stripe-checkout-diagnostic.js
