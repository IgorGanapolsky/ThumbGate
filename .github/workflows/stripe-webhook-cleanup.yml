name: Stripe Webhook Cleanup

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'apply or dry-run'
        type: choice
        required: true
        default: 'dry-run'
        options:
          - dry-run
          - apply
  push:
    branches:
      - feat/stripe-webhook-cleanup
    paths:
      - 'scripts/stripe-webhook-cleanup.js'
      - '.github/workflows/stripe-webhook-cleanup.yml'

concurrency:
  group: stripe-webhook-cleanup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --no-audit --no-fund

      - name: Dry-run on push (visible plan, no writes)
        if: ${{ github.event_name == 'push' || inputs.mode == 'dry-run' }}
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: node scripts/stripe-webhook-cleanup.js

      - name: Apply (only via workflow_dispatch with mode=apply)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'apply' }}
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: node scripts/stripe-webhook-cleanup.js --apply
