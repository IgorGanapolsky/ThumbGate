name: Publish IDE Marketplace Extension

on:
  push:
    branches: [main]
    paths:
      - 'plugins/vscode-extension/**'
      - '.github/workflows/publish-ide-marketplace.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-ide-marketplace-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      PUBLISH_IDE_MARKETPLACE_REQUIRED: ${{ vars.PUBLISH_IDE_MARKETPLACE_REQUIRED || '0' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --onnxruntime-node-install-cuda=skip

      - run: node scripts/sync-version.js --check

      - run: node --test tests/ide-marketplace-extensions.test.js

      - run: npm run build:vscode-extension

      - name: Resolve VSIX path
        id: vsix
        run: |
          version="$(node -p "require('./plugins/vscode-extension/package.json').version")"
          path="plugins/vscode-extension/thumbgate-${version}.vsix"
          test -f "$path"
          {
            echo "version=$version"
            echo "path=$path"
            echo "name=thumbgate-${version}.vsix"
          } >> "$GITHUB_OUTPUT"

      - name: Verify marketplace publishing credentials
        id: marketplace-credentials
        run: |
          missing=()
          if [ -z "$OVSX_PAT" ]; then missing+=("OVSX_PAT"); fi
          if [ -z "$VSCE_PAT" ]; then missing+=("VSCE_PAT"); fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "publish_ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Missing marketplace publish secrets: ${missing[*]}"
            {
              echo "## IDE Marketplace Publish Skipped"
              echo
              echo "Missing required GitHub Actions secrets: ${missing[*]}"
              echo
              echo "The workflow still packages and uploads the VSIX artifact, but it does not claim a live Open VSX or VS Code Marketplace publication."
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$PUBLISH_IDE_MARKETPLACE_REQUIRED" = "1" ] || [ "$PUBLISH_IDE_MARKETPLACE_REQUIRED" = "true" ]; then
              echo "::error::Marketplace publishing is required for this run."
              exit 1
            fi
            exit 0
          fi
          echo "publish_ready=true" >> "$GITHUB_OUTPUT"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          retention-days: 7
          name: thumbgate-vscode-open-vsx-vsix
          path: ${{ steps.vsix.outputs.path }}

      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.vsix.outputs.version }}
        run: |
          if ! gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release create "v${VERSION}" --title "v${VERSION}" --generate-notes
          fi

      - name: Upload VSIX to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.vsix.outputs.version }}
        run: |
          gh release upload "v${VERSION}" "${{ steps.vsix.outputs.path }}" --clobber

      - name: Publish to Open VSX
        if: steps.marketplace-credentials.outputs.publish_ready == 'true'
        run: |
          cd plugins/vscode-extension
          npx --yes ovsx publish "${{ steps.vsix.outputs.name }}" --pat "$OVSX_PAT"

      - name: Publish to VS Code Marketplace
        if: steps.marketplace-credentials.outputs.publish_ready == 'true'
        run: |
          cd plugins/vscode-extension
          npx --yes @vscode/vsce publish --packagePath "${{ steps.vsix.outputs.name }}" -p "$VSCE_PAT"
