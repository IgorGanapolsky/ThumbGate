name: Container Build

# We SHIP a Dockerfile and no job ever built it, so third-party builders (Glama, Smithery)
# were our only test of our own container — and on 2026-07-29 Glama's build failed while
# every local check passed. This builds the image we publish and proves it actually serves,
# on amd64 AND arm64, because the likeliest failure is a native module with no prebuild for
# the builder's architecture (the Dockerfile's own comments record that exact history).
# This repo is public, so GitHub-hosted runners are free.

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/container-build.yml'
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'scripts/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-serve:
    name: build image and prove /health
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3.2.0
      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      # arm64 first: it is the architecture most likely to lack a native prebuild, which is
      # the failure third-party builders hit and we never did.
      - name: Build for linux/arm64
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          platforms: linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build for linux/amd64 and load
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: thumbgate:ci
          cache-from: type=gha

      # Two runs, because they pin two different contracts.
      #
      # A bare `docker run` with no configuration is what a directory or third-party
      # builder does first. The server deliberately refuses to start without an API
      # key — that is correct — but the failure has to be FAST and SELF-EXPLANATORY,
      # not a hang or a stack trace, or the builder reports "build failed" with
      # nothing anyone can act on. That is the situation we were in with Glama.
      - name: Unconfigured container must fail fast with an actionable message
        run: |
          set -euo pipefail
          docker run --name tg-bare thumbgate:ci > /tmp/bare.log 2>&1 && rc=0 || rc=$?
          docker rm -f tg-bare >/dev/null 2>&1 || true
          echo "--- container output ---"; cat /tmp/bare.log
          if [ "$rc" -eq 0 ]; then
            echo "::error::unconfigured container exited 0 — it must refuse to serve without a key"
            exit 1
          fi
          if ! grep -q 'THUMBGATE_API_KEY is required unless THUMBGATE_ALLOW_INSECURE=true' /tmp/bare.log; then
            echo "::error::refusal message is no longer actionable — a builder cannot self-serve from this"
            exit 1
          fi
          echo "refuses to start without a key, and says exactly how to fix it"

      - name: Configured container must actually serve /health
        run: |
          set -euo pipefail
          docker run -d --name tg -p 8787:8787 -e THUMBGATE_ALLOW_INSECURE=true thumbgate:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8787/health >/dev/null 2>&1; then
              echo "healthy after ${i}s"
              # Vacuity guard: /health answering is not proof the app is up if any
              # route would answer. Assert a real page renders from inside the image.
              curl -fsS http://localhost:8787/privacy | grep -q 'capture_feedback' \
                || { echo "::error::/health answers but the app is not really serving"; \
                     docker logs tg | tail -50; docker rm -f tg >/dev/null; exit 1; }
              echo "and serves real content, not just /health"
              docker rm -f tg >/dev/null
              exit 0
            fi
            sleep 1
          done
          echo "::error::container never answered /health — this is what a directory build sees"
          docker logs tg | tail -50
          docker rm -f tg >/dev/null
          exit 1
