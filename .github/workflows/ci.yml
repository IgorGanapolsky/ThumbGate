name: CI

on:
  push:
    # Pull requests already run this full suite. Running it again on every
    # feature-branch push doubles PR latency and spend without adding signal.
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # Keep enough headroom for the full suite plus proof lanes on main.
    timeout-minutes: 60
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_PRICE_ID: ${{ secrets.STRIPE_PRICE_ID }}
      STRIPE_PRODUCT_ID: ${{ secrets.STRIPE_PRODUCT_ID }}
      STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      THUMBGATE_API_KEY: ${{ secrets.THUMBGATE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect CI scope
        id: ci-scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "reason=non-pr-event" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | sed '/^$/d' > /tmp/ci-changed-files.txt
          echo "Changed files:"
          sed 's/^/- /' /tmp/ci-changed-files.txt || true

          if [[ ! -s /tmp/ci-changed-files.txt ]]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "reason=no-changed-files" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! grep -Ev '^(\.changeset/.*\.md|CLAUDE\.md|README\.md|docs/|reports/|proof/)' /tmp/ci-changed-files.txt > /tmp/ci-non-doc-files.txt; then
            echo "mode=docs" >> "$GITHUB_OUTPUT"
            echo "reason=docs-or-reports-only" >> "$GITHUB_OUTPUT"
            echo "Docs/report-only CI selected. Merge queue and main pushes still run full CI."
            exit 0
          fi

          if grep -Ev '^(\.changeset/.*\.md|public/|config/post-deploy-marketing-pages\.json|scripts/dashboard\.js|scripts/verify-marketing-pages-deployed\.js|tests/(api-server|dashboard|public-landing|landing-page-claims|funnel-invariants|verify-marketing-pages-deployed|public-static-assets)\.test\.js|tests/e2e/)' /tmp/ci-changed-files.txt > /tmp/ci-full-required-files.txt; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "reason=runtime-or-workflow-surface" >> "$GITHUB_OUTPUT"
            echo "Files requiring full CI:"
            sed 's/^/- /' /tmp/ci-full-required-files.txt
            exit 0
          fi

          echo "mode=web" >> "$GITHUB_OUTPUT"
          echo "reason=web-revenue-surface-only" >> "$GITHUB_OUTPUT"
          echo "Focused web/revenue CI selected. Merge queue and main pushes still run full CI."

      - name: Setup Python
        if: steps.ci-scope.outputs.mode != 'web'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python deps
        if: steps.ci-scope.outputs.mode != 'web'
        # scikit-learn + joblib are required by scripts/eval_gate_classifier.py
        # so tests/eval-gate-classifier.test.js can exercise the actual ML
        # pipeline (train_and_score, joblib.dump, ROC-AUC, classification_report)
        # in CI instead of skipping the e2e branch. The package is opt-in for
        # end users — these installs only affect the CI runner.
        run: pip install pytest scikit-learn joblib
      - name: Setup Node
        if: steps.ci-scope.outputs.mode != 'docs'
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            workers/package-lock.json

      - name: Install deps
        if: steps.ci-scope.outputs.mode != 'docs'
        run: npm ci --onnxruntime-node-install-cuda=skip

      - name: Check version sync
        run: node scripts/sync-version.js --check

      - name: Check changeset coverage for release-relevant PRs
        if: steps.ci-scope.outputs.mode != 'docs' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
        run: npm run changeset:check

      - name: Run budget status gate
        if: steps.ci-scope.outputs.mode != 'docs'
        run: npm run budget:status
      - name: Check operational integrity
        if: steps.ci-scope.outputs.mode == 'full'
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run ops:integrity:ci
      - name: Check branch protection congruence
        if: steps.ci-scope.outputs.mode != 'docs' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run branch-protection:check

      - name: Run docs-only sanity checks
        if: steps.ci-scope.outputs.mode == 'docs'
        run: |
          node scripts/changeset-check.js
          git diff --check

      - name: Run focused web/revenue tests
        if: steps.ci-scope.outputs.mode == 'web'
        run: |
          node --test \
            tests/api-server.test.js \
            tests/dashboard.test.js \
            tests/public-landing.test.js \
            tests/funnel-invariants.test.js \
            tests/landing-page-claims.test.js \
            tests/verify-marketing-pages-deployed.test.js \
            tests/public-static-assets.test.js

      - name: Run tests
        if: steps.ci-scope.outputs.mode != 'web'
        run: npm test

      - name: Run gate-eval regression suite
        if: steps.ci-scope.outputs.mode != 'web'
        # Exits non-zero if any case in config/evals/*.json fails against
        # config/specs/*.json. Any constraint regex change that flips a
        # previously-blocking case to pass (or vice versa) blocks merge
        # until the eval case is consciously updated in the same PR.
        run: npm run gate-eval:ci

      - name: Run coverage
        if: steps.ci-scope.outputs.mode != 'web'
        run: npm run test:coverage

      - name: Check congruence (branding, tech stack, version across all surfaces)
        if: steps.ci-scope.outputs.mode != 'web'
        run: npm run test:congruence

      - name: Run adapter proof
        if: steps.ci-scope.outputs.mode != 'web'
        run: npm run prove:adapters

      - name: Run automation proof
        if: steps.ci-scope.outputs.mode != 'web'
        run: npm run prove:automation

      - name: Run runtime proof
        if: steps.ci-scope.outputs.mode != 'web'
        run: npm run prove:runtime

      - name: Run evolution proof
        if: steps.ci-scope.outputs.mode != 'web'
        run: npm run prove:evolution

      - name: Run workflow contract proof
        if: steps.ci-scope.outputs.mode != 'web'
        run: npm run prove:workflow-contract

      - name: Run autoresearch proof
        if: steps.ci-scope.outputs.mode != 'web'
        run: npm run prove:autoresearch

      - name: Run Tessl distribution proof
        if: steps.ci-scope.outputs.mode != 'web'
        run: npm run prove:tessl

      - name: Write prompt evaluation report
        if: always() && steps.ci-scope.outputs.mode != 'web'
        run: |
          mkdir -p proof
          node scripts/prompt-eval.js --min-score=0 --synthetic --synthetic-variants=1 --suite-output proof/prompt-eval-suite.generated.json --output proof/prompt-eval-report.json --json > /dev/null
          node -e "const fs=require('node:fs'); const report=JSON.parse(fs.readFileSync('proof/prompt-eval-report.json','utf8')); const lines=['## Prompt Evaluation', '- Score: ' + report.score + '%', '- Passed: ' + report.passed + '/' + report.total, '- Failed: ' + report.failed, '- Errors: ' + report.errors, '- Skipped: ' + report.skipped, '- Synthetic cases: ' + (report.syntheticCount || 0)]; if (report.comparison) lines.push('- Regressions: ' + report.comparison.regressions.length); fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');"

      - name: Sync GitHub About metadata on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          THUMBGATE_GITHUB_ABOUT_VERIFY_ATTEMPTS: 6
          THUMBGATE_GITHUB_ABOUT_VERIFY_DELAY_MS: 5000
        run: npm run github:about:sync

      - name: Verify live GitHub About congruence on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          THUMBGATE_GITHUB_ABOUT_VERIFY_ATTEMPTS: 6
          THUMBGATE_GITHUB_ABOUT_VERIFY_DELAY_MS: 5000
        run: npm run test:congruence:live

      - name: Upload proof artifacts
        if: always() && steps.ci-scope.outputs.mode != 'docs'
        uses: actions/upload-artifact@v7
        with:
          name: proof-artifacts
          path: |
            proof/compatibility/report.json
            proof/compatibility/report.md
            proof/automation/report.json
            proof/automation/report.md
            proof/runtime-report.json
            proof/runtime-report.md
            proof/evolution-report.json
            proof/evolution-report.md
            proof/workflow-contract/report.json
            proof/workflow-contract/report.md
            proof/autoresearch-report.json
            proof/autoresearch-report.md
            proof/tessl-report.json
            proof/tessl-report.md
            proof/prompt-eval-report.json
            proof/prompt-eval-suite.generated.json
