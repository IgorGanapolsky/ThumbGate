name: Verify Deploy and Comment on Merged PR

# Runs AFTER deploy-railway.yml finishes for a push to main.
# Re-asserts CLAUDE.md's deployment-verification gate (buildSha, health, dashboard,
# any new /learn or /guides routes added in the merge) and posts the result back
# on the PR that introduced the merged commit. Makes "is this really deployed?"
# answerable without a human running curl.

on:
  workflow_run:
    workflows: ["Deploy to Railway"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: verify-deploy-comment-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  comment-authoritative-failure:
    if: github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Comment authoritative deploy or revenue-readiness failure
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const run = context.payload.workflow_run;
            const sha = run.head_sha;
            const resp = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: sha,
            });
            if (!resp.data.length) {
              console.log(`No PR associated with ${sha}; skipping failure comment.`);
              return;
            }
            const pr = resp.data[0];
            const lines = [
              '### ❌ Railway deployment or revenue readiness failed',
              '',
              `- Authoritative workflow conclusion: **${run.conclusion || 'unknown'}**`,
              `- Commit: \`${sha}\``,
              '- The build may or may not have been promoted. Do not call it shipped, buyer-ready, or revenue-observable until the failing step and uploaded evidence are reviewed.',
              `- Workflow run: ${run.html_url}`,
            ];
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: lines.join('\n'),
            });

  verify-and-comment:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      PROD_URL: https://thumbgate.ai
      MERGE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 5
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Find PR for merge commit
        id: find-pr
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          set -eu
          PR_NUMBER="$(gh api -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/commits/${MERGE_SHA}/pulls" \
            --jq '.[0].number // ""')"
          if [ -z "${PR_NUMBER}" ]; then
            echo "No PR associated with ${MERGE_SHA}; skipping comment."
            echo "pr=" >> "$GITHUB_OUTPUT"
          else
            echo "pr=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect whether Railway deploy was required
        id: deploy-scope
        if: steps.find-pr.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          set -eu
          mkdir -p deploy-scope
          if gh run download "${{ github.event.workflow_run.id }}" --name deploy-scope --dir deploy-scope; then
            echo "Loaded deploy-scope artifact from Deploy to Railway run ${{ github.event.workflow_run.id }}."
          else
            echo "::warning::Deploy scope artifact missing; conservatively requiring buildSha verification."
          fi

          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const artifactPath = 'deploy-scope/deploy-scope.json';
          let scope = null;
          try {
            scope = JSON.parse(fs.readFileSync(artifactPath, 'utf8'));
          } catch {
            scope = {
              shouldDeploy: true,
              scopeReason: 'artifact_missing_conservative_verify',
              changedFiles: [],
            };
          }

          const changedFiles = Array.isArray(scope.changedFiles) ? scope.changedFiles : [];
          console.log('changed_files<<EOF');
          console.log(changedFiles.join('\n'));
          console.log('EOF');
          console.log(`deploy_required=${scope.shouldDeploy === false ? 'false' : 'true'}`);
          console.log(`scope_reason=${scope.scopeReason || 'unknown'}`);
          NODE

      - name: Capture current production health for skipped deploys
        if: steps.find-pr.outputs.pr != '' && steps.deploy-scope.outputs.deploy_required == 'false'
        run: |
          HEALTH_JSON="$(curl -sS --max-time 10 "${PROD_URL}/health" || echo '{}')"
          ACTUAL_SHA="$(node -e "try { const data = JSON.parse(process.argv[1]); process.stdout.write(String(data.buildSha || '')); } catch {}" "$HEALTH_JSON")"
          {
            echo "actual_sha=${ACTUAL_SHA:-unknown}"
            echo "build_match=not_required"
            echo "health_json=${HEALTH_JSON:-{}}"
          } >> "$GITHUB_ENV"

      - name: Wait for Railway to settle the new build
        if: steps.find-pr.outputs.pr != '' && steps.deploy-scope.outputs.deploy_required == 'true'
        run: |
          # Railway typically settles within 2-5 minutes of deploy-railway
          # finishing. Poll /health for up to 8 minutes for the buildSha to
          # match the merged commit. Fail loud rather than silently if it
          # never matches — that itself is signal.
          ATTEMPTS=0
          MAX_ATTEMPTS=48
          MATCH=0
          while [ "$ATTEMPTS" -lt "$MAX_ATTEMPTS" ]; do
            HEALTH_JSON="$(curl -sS --max-time 10 "${PROD_URL}/health" || echo '{}')"
            ACTUAL_SHA="$(node -e "try { const data = JSON.parse(process.argv[1]); process.stdout.write(String(data.buildSha || '')); } catch {}" "$HEALTH_JSON")"
            if [ -n "$ACTUAL_SHA" ] && [ "${ACTUAL_SHA}" = "${MERGE_SHA}" ]; then
              {
                echo "actual_sha=${ACTUAL_SHA}"
                echo "build_match=true"
                echo "health_json=${HEALTH_JSON}"
              } >> "$GITHUB_ENV"
              MATCH=1
              break
            fi
            ATTEMPTS=$((ATTEMPTS + 1))
            sleep 10
          done
          if [ "$MATCH" -ne 1 ]; then
            {
              echo "actual_sha=${ACTUAL_SHA:-unknown}"
              echo "build_match=false"
              echo "health_json=${HEALTH_JSON:-{}}"
            } >> "$GITHUB_ENV"
          fi

      - name: Probe required public routes
        if: steps.find-pr.outputs.pr != ''
        run: |
          # /health, /dashboard, and / always required.
          # Any new /learn/* or /guides/* HTML files added in the merge commit
          # are also probed — these are the most common "the link in a fresh
          # social post 404s because Railway hadn't rebuilt yet" surface.
          REQUIRED_ROUTES="/ /health /dashboard"

          NEW_PUBLIC_ROUTES="$(git diff --diff-filter=A --name-only \
            "${MERGE_SHA}~1" "${MERGE_SHA}" -- \
            'public/learn/*.html' 'public/guides/*.html' 'public/learn/**/*.html' 'public/guides/**/*.html' \
            2>/dev/null | sed 's|public||; s|\.html$||' | tr '\n' ' ')"

          ALL_ROUTES="${REQUIRED_ROUTES} ${NEW_PUBLIC_ROUTES}"
          echo "Probing: ${ALL_ROUTES}"

          FAILED_ROUTES=""
          PASSED_ROUTES=""
          for route in ${ALL_ROUTES}; do
            CODE="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "${PROD_URL}${route}" || echo 'ERR')"
            if [ "$CODE" = "200" ]; then
              PASSED_ROUTES="${PASSED_ROUTES}${route}:200 "
            else
              FAILED_ROUTES="${FAILED_ROUTES}${route}:${CODE} "
            fi
          done

          echo "passed_routes=${PASSED_ROUTES}" >> "$GITHUB_ENV"
          echo "failed_routes=${FAILED_ROUTES}" >> "$GITHUB_ENV"
          if [ -z "${FAILED_ROUTES}" ]; then
            echo "routes_clean=true" >> "$GITHUB_ENV"
          else
            echo "routes_clean=false" >> "$GITHUB_ENV"
          fi

      - name: Comment verification result on the PR
        if: steps.find-pr.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          PR: ${{ steps.find-pr.outputs.pr }}
        run: |
          BUILD_OK="${build_match:-false}"
          ROUTES_OK="${routes_clean:-false}"
          DEPLOY_REQUIRED="${{ steps.deploy-scope.outputs.deploy_required }}"
          if [ "$DEPLOY_REQUIRED" = "false" ] && [ "$ROUTES_OK" = "true" ]; then
            STATUS="ℹ️ Deploy not required for non-runtime merge"
          elif [ "$DEPLOY_REQUIRED" = "false" ] && [ "$ROUTES_OK" = "false" ]; then
            STATUS="⚠️ Deploy not required, but route probe found failures"
          elif [ "$BUILD_OK" = "true" ] && [ "$ROUTES_OK" = "true" ]; then
            STATUS="✅ Deploy verified"
          elif [ "$BUILD_OK" = "true" ] && [ "$ROUTES_OK" = "false" ]; then
            STATUS="⚠️ Deployed but route probe found failures"
          elif [ "$BUILD_OK" = "false" ]; then
            STATUS="❌ Deploy did not settle to merge SHA within 8 min"
          else
            STATUS="❓ Unexpected state"
          fi

          BODY="$(cat <<EOF
          ## ${STATUS}

          **Merge commit:** \`${MERGE_SHA}\`
          **Production buildSha:** \`${actual_sha:-unknown}\`
          **buildSha match:** ${BUILD_OK}
          **Railway deploy required:** ${DEPLOY_REQUIRED}

          **/health snapshot:**
          \`\`\`json
          ${health_json:-{}}
          \`\`\`

          **Public-route probes** (200 only counts as pass):
          - Pass: \`${passed_routes:-none}\`
          - Fail: \`${failed_routes:-none}\`

          _Generated by \`.github/workflows/verify-deploy-comment.yml\` after \`deploy-railway.yml\` finished. This comment is the CLAUDE.md deployment-verification gate, run automatically so no human has to curl-by-hand before saying "deployed"._
          EOF
          )"

          gh pr comment "${PR}" --repo "${GITHUB_REPOSITORY}" --body "${BODY}"
