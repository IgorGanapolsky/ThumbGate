name: Dependabot Auto-Merge

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read
  issues: write

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  dependabot-automerge:
    name: dependabot-automerge
    if: github.event.pull_request.user.login == 'dependabot[bot]' && !github.event.pull_request.draft
    runs-on: ubuntu-latest

    steps:
      - name: Checkout trusted base workflow tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Auto-approve update
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3a10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ github.token }}
          script: |
            const pr = context.payload.pull_request;

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const alreadyApproved = reviews.some(
              (review) =>
                review.user?.login === "github-actions[bot]" &&
                review.state === "APPROVED"
            );

            if (alreadyApproved) {
              core.info("Dependabot update already approved by github-actions[bot].");
              return;
            }

            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              event: "APPROVE",
              body: "Auto-approved Dependabot update.",
            });

      - name: Checkout Dependabot head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ github.token }}
          path: .dependabot-head

      - name: Add generated changeset for manifest-only dependency bumps
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          mapfile -t changed_files < <(gh pr diff "$PR_URL" --name-only)
          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "No changed files detected for $PR_URL"
            exit 0
          fi

          for file in "${changed_files[@]}"; do
            case "$file" in
              package.json|package-lock.json|workers/package.json|workers/package-lock.json) ;;
              *)
                echo "Skipping generated changeset because $file is outside manifest-only dependency bumps."
                exit 0
                ;;
            esac
          done

          # Paths must be relative to the Dependabot head checkout. `git -C`
          # plus a `.dependabot-head/` prefix looks for a nested directory that
          # does not exist. `git diff --quiet` also ignores untracked files, so
          # a newly written changeset looked "already committed" and Trunk test
          # PRs later failed Verify changeset (observed on #3478/#3468/#3467).
          rel_path=".changeset/dependabot-pr-${PR_NUMBER}.md"
          node scripts/dependabot-changeset.js --title "$PR_TITLE" --output ".dependabot-head/${rel_path}" >/tmp/dependabot-changeset-path.txt

          if [ -z "$(git -C .dependabot-head status --porcelain -- "$rel_path")" ]; then
            echo "Generated changeset already matches $rel_path"
            exit 0
          fi

          git -C .dependabot-head config user.name 'github-actions[bot]'
          git -C .dependabot-head config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C .dependabot-head add "$rel_path"
          git -C .dependabot-head commit -m "chore: add changeset for dependabot PR #${PR_NUMBER}"
          git -C .dependabot-head push origin "HEAD:${HEAD_REF}"

      - name: Enable GitHub native auto-merge
        # Replaces the /trunk merge comment workflow that was stalling on
        # BEHIND branches (Oct 2026). GitHub's native auto-merge handles
        # branch auto-update (via allow_update_branch: true) + merge after
        # all required status checks pass. The dependabot.yml `auto-merge`
        # block is the primary mechanism; this step is the belt-and-suspenders
        # fallback for PRs that don't match the dependabot.yml criteria.
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # Enable GitHub auto-merge via API (idempotent — skips if already enabled).
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/auto-merge" \
            -f "merge_method=squash" \
            -f "commit_message=Auto-merge: Dependabot update" \
            -f "commit_title=chore: auto-merge ${PR_NUMBER}" \
            2>/dev/null || {
            echo "Auto-merge already enabled or failed to enable — relying on dependabot.yml config"
          }

          {
            echo "### Merge automation"
            echo "- Provider: github-native-auto-merge"
            echo "- PR: $PR_URL"
            echo "- Mode: squash, auto-merge after required checks pass"
          } >> "$GITHUB_STEP_SUMMARY"
