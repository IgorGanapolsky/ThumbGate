name: Rollback Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        default: production
        options:
          - production
          - staging
      tag_or_sha:
        description: Git tag or SHA to roll back to
        required: true
        type: string
      confirm:
        description: Type 'CONFIRM' to proceed with rollback
        required: true
        type: string
    timeout-minutes: 10

jobs:
  rollback:
    name: Rollback to ${{ inputs.tag_or_sha }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "CONFIRM" ]; then
            echo "::error::Rollback requires typed confirmation 'CONFIRM'"
            exit 1
          fi
          echo "Confirmation received."

      - name: Validate tag/SHA exists
        run: |
          git fetch --all --tags
          if ! git cat-file -t "${{ inputs.tag_or_sha }}" 2>/dev/null; then
            echo "::error::Tag or SHA '${{ inputs.tag_or_sha }}' not found in repository"
            exit 1
          fi
          echo "Found ${{ inputs.tag_or_sha }}"

      - name: Generate deployment ID
        id: deploy
        run: |
          echo "deployment_id=rollback-$(date +%s)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Request deployment
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.RAILWAY_APP_ID }}
          private-key: ${{ vars.RAILWAY_PRIVATE_KEY }}

      - name: Wait for confirmation (manual approval gate)
        uses: actions/github-script@v7
        with:
          script: |
            core.warning('Manual review required. Check GitHub Deployments for approval.');

      - name: Rollback Railway service
        run: |
          # Uses Railway CLI to restart with the target image tag
          # The Railway service will pull the specified SHA/tag from the git integration
          railway link --project ${{ secrets.RAILWAY_PROJECT_ID }}
          railway redeploy --environment ${{ inputs.environment }} --service thumbgate-api --tag ${{ inputs.tag_or_sha }}
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}

      - name: Verify health after rollback
        run: |
          sleep 30
          HEALTH_URL=$(railway service get --environment ${{ inputs.environment }} --service thumbgate-api --print-service-url)
          curl -sf "${HEALTH_URL}/health" || exit 1
          echo "Rollback verified: service is healthy"

      - name: Record rollback in Handoffs
        run: |
          mkdir -p ~/Documents/AI-Agent-Sync/Handoffs/
          cat > ~/Documents/AI-Agent-Sync/Handoffs/rollback-$(date +%s).md << 'EOF'
          ## Rollback Record
          - Environment: ${{ inputs.environment }}
          - Target SHA/Tag: ${{ inputs.tag_or_sha }}
          - Deployment ID: ${{ steps.deploy.outputs.deployment_id }}
          - Triggered by: ${{ github.actor }}
          - Triggered at: ${{ github.event.inputs.confirm }}
          - Status: ${
          { status: 'pending', sha: '${{ inputs.tag_or_sha }}', environment: '${{ inputs.environment }}' }
          }
          EOF
