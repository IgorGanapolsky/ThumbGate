name: ThumbGate Creator Platform Promo

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview, publish, schedule, verify, or fallback'
        required: true
        type: choice
        default: preview
        options:
          - preview
          - publish
          - schedule
          - verify
          - fallback
      platforms:
        description: 'Comma-separated platforms'
        required: false
        default: 'linkedin,instagram,threads,bluesky,reddit,youtube'
      schedule:
        description: 'ISO-8601 scheduled time, required for schedule mode'
        required: false
        default: ''
      timezone:
        description: 'IANA timezone for schedule mode'
        required: false
        default: 'America/New_York'
      offer:
        description: 'Campaign offer to publish'
        required: false
        default: 'operator-lab'
      reddit_parent_id:
        description: 'Reddit weekly project-display thread fullname for fallback mode'
        required: false
        default: 't3_1uqwwus'

permissions:
  contents: read

concurrency:
  group: thumbgate-creator-platform-promo
  cancel-in-progress: false

jobs:
  promo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
      ZERNIO_INSTAGRAM_ACCOUNT_ID: ${{ secrets.ZERNIO_INSTAGRAM_ACCOUNT_ID }}
      ZERNIO_LINKEDIN_ACCOUNT_ID: ${{ secrets.ZERNIO_LINKEDIN_ACCOUNT_ID }}
      ZERNIO_PROFILE_ID: ${{ secrets.ZERNIO_PROFILE_ID }}
      ZERNIO_REDDIT_ACCOUNT_ID: ${{ secrets.ZERNIO_REDDIT_ACCOUNT_ID }}
      ZERNIO_TIKTOK_ACCOUNT_ID: ${{ secrets.ZERNIO_TIKTOK_ACCOUNT_ID }}
      ZERNIO_YOUTUBE_ACCOUNT_ID: ${{ secrets.ZERNIO_YOUTUBE_ACCOUNT_ID }}
      DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
      REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --onnxruntime-node-install-cuda=skip

      - name: Preview campaign
        if: github.event.inputs.mode == 'preview'
        run: |
          npm run social:publish:launch -- \
            --dry-run \
            --offer="${{ github.event.inputs.offer }}" \
            --platforms="${{ github.event.inputs.platforms }}"

      - name: Require Zernio API key
        if: github.event.inputs.mode == 'publish' || github.event.inputs.mode == 'schedule' || github.event.inputs.mode == 'verify'
        run: |
          if [ -z "${ZERNIO_API_KEY}" ]; then
            echo "ZERNIO_API_KEY is required for publish, schedule, and verify modes." >&2
            exit 1
          fi

      - name: Verify latest release receipts
        if: github.event.inputs.mode == 'verify'
        run: npm run social:verify:latest-release

      - name: Publish missing channels through direct fallbacks
        if: github.event.inputs.mode == 'fallback'
        run: |
          npm run social:publish:latest-release-fallbacks -- \
            --platforms="${{ github.event.inputs.platforms }}" \
            --reddit-parent-id="${{ github.event.inputs.reddit_parent_id }}"

      - name: Publish campaign
        if: github.event.inputs.mode == 'publish'
        run: |
          npm run social:publish:launch -- \
            --offer="${{ github.event.inputs.offer }}" \
            --platforms="${{ github.event.inputs.platforms }}"

      - name: Publish release article to Dev.to
        if: ${{ always() && github.event.inputs.mode == 'publish' && github.event.inputs.offer == 'release-1.28.0' }}
        run: node scripts/social-analytics/publish-latest-release-article.js

      - name: Schedule campaign
        if: github.event.inputs.mode == 'schedule'
        run: |
          if [ -z "${{ github.event.inputs.schedule }}" ]; then
            echo "schedule input is required when mode=schedule" >&2
            exit 1
          fi

          npm run social:publish:launch -- \
            --offer="${{ github.event.inputs.offer }}" \
            --platforms="${{ github.event.inputs.platforms }}" \
            --schedule="${{ github.event.inputs.schedule }}" \
            --timezone="${{ github.event.inputs.timezone }}"
