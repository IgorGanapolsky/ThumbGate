name: Agent PR Auto-Merge

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - labeled
  workflow_run:
    workflows:
      - CI  # Only trigger on final CI completion, not every sub-workflow
    types:
      - completed
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to evaluate with pr-manager
        required: false

permissions:
  contents: write
  pull-requests: write
  checks: read
  issues: write

concurrency:
  group: agent-automerge-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  THUMBGATE_MAIN_MERGE_PROVIDER: trunk

jobs:
  agent-automerge:
    name: agent-automerge
    if: >-
      github.event.pull_request.draft != true &&
      (
        github.event_name != 'workflow_run' ||
        github.event.workflow_run.conclusion == 'success'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GH_PAT || github.token }}

    steps:
      - name: Resolve PR number
        id: pr
        run: |
          set -euo pipefail
          number=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.pr_number }}" ]; then
            number="${{ inputs.pr_number }}"
          elif [ -n "${{ github.event.pull_request.number }}" ]; then
            number="${{ github.event.pull_request.number }}"
          fi
          echo "number=${number}" >> "$GITHUB_OUTPUT"
          if [ -z "${number}" ]; then
            echo "No pull request bound to this event."
          fi

      - name: Check GitHub API rate limit
        if: steps.pr.outputs.number != ''
        run: |
          remaining=$(gh api rate-limit --jq '.rate.remaining' 2>/dev/null || echo "1")
          if [ "${remaining:-1}" -lt 10 ]; then
            echo "::warning::Rate limit low (${remaining:-unknown} remaining), deferring merge"
            exit 0
          fi

      - name: Checkout trusted default branch
        if: steps.pr.outputs.number != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Request merge automation
        if: steps.pr.outputs.number != ''
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail

          ref="$(gh pr view "$PR_NUMBER" --json headRefName --jq .headRefName)"
          draft="$(gh pr view "$PR_NUMBER" --json isDraft --jq .isDraft)"
          repo="$(gh pr view "$PR_NUMBER" --json headRepository --jq .headRepository.nameWithOwner)"

          if [ "$draft" = "true" ]; then
            echo "Skipping draft PR #$PR_NUMBER"
            exit 0
          fi
          if [ "$repo" != "${{ github.repository }}" ]; then
            echo "Skipping fork PR #$PR_NUMBER from $repo"
            exit 0
          fi

          case "$ref" in
            claude/*|codex/*|auto/*|agent/*|fix/*|feat/*|chore/*) ;;
            *)
              labels="$(gh pr view "$PR_NUMBER" --json labels --jq '[.labels[].name]|join(",")')"
              case ",$labels," in
                *,automerge,*) ;;
                *)
                  echo "Skipping #$PR_NUMBER on $ref (no automerge prefix or label)"
                  exit 0
                  ;;
              esac
              ;;
          esac

          echo "Evaluating PR #$PR_NUMBER ($ref) with pr-manager"
          node scripts/pr-manager.js "$PR_NUMBER"

          {
            echo "### Merge automation"
            echo "- Provider: ${THUMBGATE_MAIN_MERGE_PROVIDER}"
            echo "- PR: #$PR_NUMBER"
            echo "- Head: \`$ref\`"
            echo "- Evaluator: \`node scripts/pr-manager.js\`"
          } >> "$GITHUB_STEP_SUMMARY"
