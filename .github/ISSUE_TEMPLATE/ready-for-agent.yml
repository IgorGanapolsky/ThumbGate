name: Ready for Agent
description: Queue a bounded, proof-ready implementation run for the ThumbGate.
title: '[Agent] '
labels:
  - ready-for-agent
body:
  - type: textarea
    id: business_outcome
    attributes:
      label: Business outcome
      description: Describe the customer or operator result this task should produce.
      placeholder: Reduce friction for Context Gateway onboarding by turning checkout success into a reusable API-key handoff.
    validations:
      required: true

  - type: dropdown
    id: use_case_bucket
    attributes:
      label: Use-case bucket
      description: Choose the product/business lane this issue advances.
      options:
        - revenue-truth
        - agent-reliability
        - governance
        - distribution
        - enterprise-pilot
        - operator-productivity
    validations:
      required: true

  - type: input
    id: milestone
    attributes:
      label: Milestone
      description: Name the measurable milestone this issue belongs to.
      placeholder: Exact observability — token burn and saved retry spend are visible in the dashboard.
    validations:
      required: true

  - type: dropdown
    id: phase
    attributes:
      label: Phase
      description: Current lifecycle phase for this issue.
      options:
        - discover
        - design
        - build
        - verify
        - release
        - observe
    validations:
      required: true

  - type: dropdown
    id: agent_lane
    attributes:
      label: Agent lane
      description: Who or what should execute the implementation.
      options:
        - codex
        - copilot
        - cursor
        - claude
        - human
        - mixed
    validations:
      required: true

  - type: dropdown
    id: risk_tier
    attributes:
      label: Risk tier
      description: Highest-risk surface this issue can touch.
      options:
        - P0 production/revenue/security
        - P1 user-facing
        - P2 internal
        - P3 docs/test
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: State the failure mode, missing capability, or bottleneck in concrete terms.
      placeholder: The current flow provisions a key, but the repo lacks a reusable agent-run contract and proof gate for deterministic execution.
    validations:
      required: true

  - type: textarea
    id: telemetry_expected
    attributes:
      label: Telemetry expected after release
      description: Name the metric, log, dashboard field, or live smoke that should move after this lands.
      placeholder: |
        - /v1/dashboard.tokenBurn.trackedEvents increases when token-usage.jsonl has provider usage
        - Cost chat answers cite both token savings and token burn
    validations:
      required: true

  - type: textarea
    id: rollback_path
    attributes:
      label: Rollback path
      description: Explain how to safely revert or disable the change if verification fails.
      placeholder: Revert the PR; the dashboard ignores missing tokenBurn and continues to render tokenSavings.
    validations:
      required: true

  - type: input
    id: token_cost_budget
    attributes:
      label: Token/cost budget
      description: Estimate model/tool budget for the agent run, or state why it is not model-backed.
      placeholder: <= 120k tokens; no cloud model calls in tests.
    validations:
      required: true

  - type: textarea
    id: in_scope
    attributes:
      label: In scope
      description: List the exact files, modules, and behaviors the agent is allowed to change.
      placeholder: |
        - WORKFLOW.md
        - .github/ISSUE_TEMPLATE/ready-for-agent.yml
        - scripts/validate-workflow-contract.js
        - tests/workflow-contract.test.js
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: Call out the areas the agent must not touch.
      placeholder: |
        - Stripe product IDs
        - unrelated MCP adapters
        - packaging/version bumps unless required by the task
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: One line per required outcome.
      placeholder: |
        - Repo-owned workflow contract exists at WORKFLOW.md
        - CI fails if the workflow contract or proof template drifts
        - Verification evidence is updated with exact commands and results
    validations:
      required: true

  - type: textarea
    id: proof_commands
    attributes:
      label: Proof commands
      description: The commands that must pass before the task can land.
      value: |
        npm test
        npm run test:coverage
        npm run prove:adapters
        npm run prove:automation
        npm run self-heal:check
    validations:
      required: true

  - type: textarea
    id: context_links
    attributes:
      label: Context links
      description: Link specs, PRs, screenshots, or docs the agent should use.
      placeholder: |
        - WORKFLOW.md contract proposal
        - docs/VERIFICATION_EVIDENCE.md
        - https://github.com/openai/symphony/blob/main/SPEC.md

  - type: textarea
    id: risks
    attributes:
      label: Risks and edge cases
      description: Call out anything that could break if the task is implemented poorly.
      placeholder: The agent must not add dead code, weaken proof gates, or mutate tracked proof files during iteration without final evidence.
