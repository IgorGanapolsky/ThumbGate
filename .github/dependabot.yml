version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    cooldown:
      default-days: 1
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore"
      include: "scope"
    # Group all npm dependencies into one PR to reduce churn.
    # Security advisories are still split into individual PRs by Dependabot.
    groups:
      npm-dependencies:
        patterns:
          - "*"
    # Native GitHub auto-merge (GA 2026-02). Handles branch auto-update
    # (requires allow_update_branch: true, now enabled) + merge after
    # required status checks pass. Replaces the /trunk merge comment
    # workflow that was stalling on BEHIND branches.
    auto-merge:
      - match:
          dependency_type: "all"
          update_type: "version-update:semver-patch"
        merge_method: "squash"
        wait_for_all_checks: true
      - match:
          dependency_type: "all"
          update_type: "version-update:semver-minor"
        merge_method: "squash"
        wait_for_all_checks: true

  - package-ecosystem: "npm"
    directory: "/workers"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:05"
    cooldown:
      default-days: 1
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
      - "workers"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      workers-dependencies:
        patterns:
          - "*"
    auto-merge:
      - match:
          dependency_type: "all"
          update_type: "version-update:semver-patch"
        merge_method: "squash"
        wait_for_all_checks: true
      - match:
          dependency_type: "all"
          update_type: "version-update:semver-minor"
        merge_method: "squash"
        wait_for_all_checks: true

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
    cooldown:
      default-days: 1
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "ci"
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
      github-actions:
        patterns:
          - "*"
        exclude-patterns:
          - "github/codeql-action*"
    auto-merge:
      - match:
          dependency_type: "all"
        merge_method: "squash"
        wait_for_all_checks: true
