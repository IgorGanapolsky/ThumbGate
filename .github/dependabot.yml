version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    cooldown:
      default-days: 1
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore"
      include: "scope"
    # Group all npm dependencies into one PR to reduce churn.
    # Security advisories are still split into individual PRs by Dependabot.
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # @lancedb/lancedb@0.40.0 requires peer apache-arrow@">=15.0.0 <=18.1.0"
      - dependency-name: "apache-arrow"
        versions: [">= 19.0.0"]
  - package-ecosystem: "npm"
    directory: "/workers"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:05"
    cooldown:
      default-days: 1
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
      - "workers"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      workers-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
    cooldown:
      default-days: 1
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "ci"
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
      github-actions:
        patterns:
          - "*"
        exclude-patterns:
          - "github/codeql-action*"
