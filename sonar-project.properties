# e2) javascript:S3403 ("this === will always be false") fires on the canonical
#     CommonJS entry-point guard, `if (require.main === module)`. Sonar's type
#     model reads require.main as Module|undefined and module as NodeModule and
#     concludes the comparison can never hold. It holds: this is the idiom in
#     Node's own documentation, and every CLI in scripts/ depends on it.
#
#     Measured 2026-08-25 against the live SonarCloud API:
#       176 open BUGs on the project
#       147 of them are S3403          (84%)
#       169 files contain `require.main === module`
#     So S3403 is, in this codebase, a false-positive generator that buries the
#     ~29 genuine bugs behind noise. Rewriting 169 entry points to satisfy it
#     would change real startup behaviour to improve a score, which is the wrong
#     trade.
#
#     ACCEPTED RISK, stated plainly: this suppresses S3403 everywhere, so a
#     genuinely always-false === elsewhere in the codebase would also go
#     unreported by Sonar. That was judged acceptable because every instance
#     sampled was the idiom, and because a rule at 84% false-positive rate is
#     already being ignored in practice — which is worse, since it is ignored
#     silently.
#
#     Re-check before assuming this is still correct:
#       curl -s "https://sonarcloud.io/api/issues/search?componentKeys=IgorGanapolsky_ThumbGate&resolved=false&rules=javascript:S3403&ps=1"
#     If the count is far above the `require.main === module` occurrence count,
#     something other than the idiom is firing and this exclusion needs narrowing.
sonar.issue.ignore.multicriteria.e2.ruleKey=javascript:S3403
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.js
# Copy-paste-detection exclusions.
#
# 1) Publisher CLI wrappers share an identical argparse + env-validation +
#    error-exit pattern by design — each platform publisher in
#    scripts/social-analytics/publishers/ follows the same shape. safeForLog +
#    buildHeaders are already shared via require() from linkedin-comment.js;
#    the CLI entrypoint block is intentionally parallel and should not
#    trigger new_duplicated_lines_density failures on future publishers.
#
# 2) scripts/seo-gsd.js is the SEO guide registry. Each PAGE_BLUEPRINTS and
#    BROWSER_BRIDGE_GUIDE_SPECS entry is a data record (query, path, hero,
#    takeaways, sections, faq, relatedPaths) whose shape is deliberately
#    parallel across guides — that parallelism is the schema. Further
#    abstraction would hurt author ergonomics without improving reliability
#    or security. Treat this file as data, not logic, for CPD purposes.
#
# 3) Revenue-pack, demand-pack, and revenue-machine generators are
#    intentionally parallel operator artifacts. Their repeated fields are the
#    commercial schema (surface, buyer signal, proof trigger, CTA, guardrails),
#    while shared rendering and tracking helpers live in utility scripts. Keep
#    bugs, coverage, and security scanning active, but exclude these
#    template-shaped sales records from copy-paste detection.
#
# 4) High-ROI operator generators and guardrail packs are generated/registry-
#    shaped scripts. Their repeated JSON-ish records, launcher scaffolds, and
#    prompt/checklist strings are the product workflow definitions, not copied
#    imperative code. Keep those files in normal Sonar analysis; exclude only
#    CPD so generated records do not block security-positive releases.
#
# 5) The ThumbGate launch publisher is also template-shaped campaign data:
#    one function intentionally carries parallel per-platform copy and UTM
#    variants. The runtime path is still covered by tests and normal Sonar
#    rules; CPD should not treat buyer-message variants as duplicated logic.
#
# 6) Marketplace distribution packs are another operator-template family:
#    channel records intentionally repeat buyer, CTA, proof-link, and step
#    fields so docs, JSON, and CSV stay isomorphic. Keep normal issue and
#    coverage rules active; exclude only CPD for those generated records.
sonar.cpd.exclusions=scripts/social-analytics/publishers/linkedin-*.js,scripts/social-analytics/publish-thumbgate-launch.js,scripts/seo-gsd.js,scripts/*revenue-pack.js,scripts/*demand-pack.js,scripts/*workflow-hardening-pack.js,scripts/*distribution-pack.js,scripts/may-2026-revenue-machine.js,scripts/*guardrails.js,scripts/agent-design-governance.js,scripts/bluesky-monitor-launchd.js,scripts/reddit-monitor-launchd.js,scripts/medium-weekly.js,scripts/prove-seo-gsd.js,scripts/tool-registry.js,scripts/cli-schema.js,scripts/upstream-contribution-engine.js,src/api/server.js
