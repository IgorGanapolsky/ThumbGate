<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%" height="100%">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="glowG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="glowR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="300" rx="16" fill="url(#heroBg)"/>

  <!-- Subtle grid lines -->
  <path d="M0 60 H960 M0 120 H960 M0 180 H960 M0 240 H960" stroke="#334155" stroke-opacity="0.2" stroke-width="1"/>
  <path d="M192 0 V300 M384 0 V300 M576 0 V300 M768 0 V300" stroke="#334155" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Left: Thumbs Up Card 👍 -->
  <g transform="translate(60, 45)" filter="url(#shadow)">
    <rect width="210" height="210" rx="20" fill="#064e3b" fill-opacity="0.8" stroke="url(#glowG)" stroke-width="2.5"/>
    <text x="105" y="90" font-size="64" text-anchor="middle">👍</text>
    <text x="105" y="138" font-family="-apple-system, sans-serif" font-size="18" font-weight="bold" fill="#6ee7b7" text-anchor="middle">THUMBS UP</text>
    <text x="105" y="165" font-family="-apple-system, sans-serif" font-size="13" fill="#a7f3d0" text-anchor="middle">Reinforce Good Actions</text>
    <rect x="35" y="178" width="140" height="20" rx="10" fill="#047857"/>
    <text x="105" y="192" font-family="monospace" font-size="11" fill="#ecfdf5" text-anchor="middle">npx thumbgate capture up</text>
  </g>

  <!-- Center: Brand Title & Motto -->
  <g transform="translate(480, 75)">
    <text x="0" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="44" font-weight="900" fill="url(#brandGrad)" text-anchor="middle">ThumbGate</text>
    <text x="0" y="65" font-family="-apple-system, sans-serif" font-size="18" font-weight="bold" fill="#f8fafc" text-anchor="middle">The Infrastructure Firewall for AI Agents</text>
    <text x="0" y="95" font-family="-apple-system, sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">Pre-Action Interdiction • Local-First Gates • Self-Improving Rules</text>
    
    <!-- Badges -->
    <rect x="-180" y="125" width="110" height="30" rx="15" fill="#312e81" stroke="#6366f1" stroke-width="1.5"/>
    <text x="-125" y="145" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#c7d2fe" text-anchor="middle">⚡ Pre-Action</text>

    <rect x="-55" y="125" width="110" height="30" rx="15" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <text x="0" y="145" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#a7f3d0" text-anchor="middle">🔒 Hard Block</text>

    <rect x="70" y="125" width="110" height="30" rx="15" fill="#4c1d95" stroke="#a855f7" stroke-width="1.5"/>
    <text x="125" y="145" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" fill="#e9d5ff" text-anchor="middle">🤖 Model Agnostic</text>
  </g>

  <!-- Right: Thumbs Down Card 👎 -->
  <g transform="translate(690, 45)" filter="url(#shadow)">
    <rect width="210" height="210" rx="20" fill="#450a0a" fill-opacity="0.8" stroke="url(#glowR)" stroke-width="2.5"/>
    <text x="105" y="90" font-size="64" text-anchor="middle">👎</text>
    <text x="105" y="138" font-family="-apple-system, sans-serif" font-size="18" font-weight="bold" fill="#fca5a5" text-anchor="middle">THUMBS DOWN</text>
    <text x="105" y="165" font-family="-apple-system, sans-serif" font-size="13" fill="#fecdd3" text-anchor="middle">Block Repeat Failures</text>
    <rect x="30" y="178" width="150" height="20" rx="10" fill="#b91c1c"/>
    <text x="105" y="192" font-family="monospace" font-size="11" fill="#fff1f2" text-anchor="middle">npx thumbgate capture down</text>
  </g>
</svg>
