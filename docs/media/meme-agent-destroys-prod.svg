<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="redCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="greenCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="450" rx="16" fill="url(#bg)"/>

  <!-- Title -->
  <text x="450" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold" fill="#f8fafc" text-anchor="middle">
    AI Coding Agents: Expectation vs. ThumbGate Reality
  </text>

  <!-- LEFT CARD: WITHOUT THUMBGATE -->
  <rect x="40" y="75" width="390" height="340" rx="12" fill="url(#redCard)" stroke="#ef4444" stroke-width="2"/>
  
  <text x="235" y="110" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="bold" fill="#fca5a5" text-anchor="middle">
    ❌ Without ThumbGate
  </text>
  
  <!-- Dialogue Bubble 1 -->
  <rect x="60" y="135" width="350" height="75" rx="8" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
  <text x="75" y="160" font-family="monospace" font-size="13" fill="#f87171">🤖 AI Agent (overconfident):</text>
  <text x="75" y="185" font-family="monospace" font-size="13" fill="#f1f5f9">"Refactoring test suite..."</text>
  <text x="75" y="200" font-family="monospace" font-size="12" fill="#ef4444">$ rm -rf tests/ &amp;&amp; git push -f main</text>

  <!-- Chaos Result -->
  <rect x="60" y="230" width="350" height="155" rx="8" fill="#0f172a" stroke="#792727" stroke-width="1.5"/>
  <text x="75" y="260" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" fill="#fca5a5">💥 Production Outage at 4:55 PM:</text>
  <text x="75" y="290" font-family="-apple-system, sans-serif" font-size="13" fill="#cbd5e1">• Main branch overwritten</text>
  <text x="75" y="315" font-family="-apple-system, sans-serif" font-size="13" fill="#cbd5e1">• 78 unit tests deleted</text>
  <text x="75" y="340" font-family="-apple-system, sans-serif" font-size="13" fill="#cbd5e1">• AI Agent: "I apologize for the confusion!" 😭</text>
  <text x="75" y="365" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#ef4444">💸 Developer: Weekend ruined fixing prod</text>


  <!-- RIGHT CARD: WITH THUMBGATE -->
  <rect x="470" y="75" width="390" height="340" rx="12" fill="url(#greenCard)" stroke="#10b981" stroke-width="2"/>
  
  <text x="665" y="110" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="bold" fill="#6ee7b7" text-anchor="middle">
    🛡️ With ThumbGate PreToolUse Interdiction
  </text>

  <!-- Dialogue Bubble 2 -->
  <rect x="490" y="135" width="350" height="75" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
  <text x="505" y="160" font-family="monospace" font-size="13" fill="#34d399">🤖 AI Agent proposes tool call:</text>
  <text x="505" y="185" font-family="monospace" font-size="12" fill="#f1f5f9">$ git push --force origin main</text>

  <!-- ThumbGate Interdiction Gate -->
  <rect x="490" y="230" width="350" height="155" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="505" y="260" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" fill="#a7f3d0">⛔ THUMBGATE INTERCEPTED (0ms):</text>
  <text x="505" y="288" font-family="monospace" font-size="12" fill="#6ee7b7">VERDICT: DENY (PreToolUse Hook)</text>
  <text x="505" y="312" font-family="monospace" font-size="12" fill="#e2e8f0">RULE: Never force-push to main</text>
  <text x="505" y="336" font-family="-apple-system, sans-serif" font-size="13" fill="#6ee7b7">✓ Tool execution blocked BEFORE run</text>
  <text x="505" y="365" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold" fill="#34d399">😎 Developer: Enjoys weekend in peace</text>
</svg>
