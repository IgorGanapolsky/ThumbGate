<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offer retired | ThumbGate</title>
<meta name="robots" content="noindex">
<meta name="description" content="This offer has been retired. Compare the free ThumbGate CLI and self-serve Pro.">
<style>
:root {
  color-scheme: dark;
  --bg: #05080a;
  --panel: #0d1418;
  --panel-2: #12181d;
  --line: #24323a;
  --text: #eef7f9;
  --muted: #a9b7bd;
  --cyan: #28d5ee;
  --green: #48dd83;
  --red: #ff7676;
  --white: #ffffff;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  line-height: 1.5;
}
a { color: inherit; }
header, main, footer { width: min(1120px, calc(100% - 32px)); margin: 0 auto; }
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  padding: 24px 0;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 800;
  letter-spacing: 0;
}
.mark {
  width: 28px;
  height: 28px;
  display: block;
}
nav { display: flex; gap: 18px; color: var(--muted); font-size: 14px; }
.hero {
  display: grid;
  grid-template-columns: minmax(0, 1.05fr) minmax(340px, 0.95fr);
  gap: 36px;
  align-items: start;
  padding: 54px 0 40px;
}
.eyebrow {
  color: var(--cyan);
  font-size: 13px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .08em;
}
h1 {
  margin: 14px 0 18px;
  max-width: 720px;
  font-size: clamp(42px, 6vw, 76px);
  line-height: .92;
  letter-spacing: 0;
}
.lede {
  max-width: 650px;
  margin: 0 0 26px;
  color: var(--muted);
  font-size: 20px;
}
.actions { display: flex; flex-wrap: wrap; gap: 12px; }
.diagnostic-pay-form {
  width: min(100%, 520px);
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
}
.diagnostic-pay-form label { margin-top: 0; }
.diagnostic-pay-form button { margin-top: 10px; }
.diagnostic-pay-form .hint { display: block; margin-top: 8px; }
.button {
  min-height: 48px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0 18px;
  border: 1px solid var(--line);
  border-radius: 7px;
  text-decoration: none;
  font-weight: 800;
  color: var(--text);
}
.button.primary {
  border-color: var(--cyan);
  background: var(--cyan);
  color: #031014;
}
.proof-strip {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  margin-top: 34px;
}
.proof {
  min-height: 90px;
  padding: 16px;
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: 8px;
}
.proof strong { display: block; font-size: 20px; }
.proof span { color: var(--muted); font-size: 14px; }
.intake-card {
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: 8px;
  padding: 24px;
}
.intake-card h2 { margin: 0 0 10px; font-size: 24px; }
.intake-card p { color: var(--muted); margin: 0 0 18px; }
label {
  display: block;
  margin: 14px 0 7px;
  color: var(--text);
  font-size: 14px;
  font-weight: 750;
}
input, textarea, select {
  width: 100%;
  border: 1px solid #32424a;
  border-radius: 7px;
  background: #070b0d;
  color: var(--text);
  padding: 12px;
  font: inherit;
}
textarea { min-height: 116px; resize: vertical; }
button {
  width: 100%;
  min-height: 50px;
  margin-top: 18px;
  border: 0;
  border-radius: 7px;
  background: var(--cyan);
  color: #031014;
  font: inherit;
  font-weight: 900;
  cursor: pointer;
}
.hint { font-size: 13px; color: var(--muted); }
section {
  padding: 40px 0;
  border-top: 1px solid var(--line);
}
.grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}
.box {
  min-height: 170px;
  padding: 20px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel-2);
}
.box h3 { margin: 0 0 8px; }
.box p { margin: 0; color: var(--muted); }
.pain-grid, .steps {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
}
.pain, .step {
  min-height: 140px;
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel-2);
}
.pain h3, .step h3 { margin: 0 0 8px; font-size: 17px; }
.pain p, .step p { margin: 0; color: var(--muted); font-size: 14px; }
.step-num { color: var(--cyan); font-weight: 900; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
.table-wrap {
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
}
table.compare {
  width: 100%;
  border-collapse: collapse;
  min-width: 640px;
  font-size: 14px;
}
table.compare th, table.compare td {
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  vertical-align: top;
}
table.compare th { background: #0b1114; color: var(--cyan); }
table.compare td:last-child { color: var(--green); font-weight: 800; }
.faq-item { border-bottom: 1px solid var(--line); }
.faq-q {
  width: 100%;
  border: 0;
  background: transparent;
  color: var(--text);
  text-align: left;
  padding: 16px 0;
  font: inherit;
  font-weight: 800;
  cursor: pointer;
}
.faq-a { display: none; padding: 0 0 16px; color: var(--muted); }
.faq-item.open .faq-a { display: block; }
.cta-band {
  margin-top: 22px;
  padding: 20px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
}
.cta-band p { margin: 0; color: var(--muted); }
footer { padding: 32px 0 44px; color: var(--muted); }
@media (max-width: 860px) {
  header { align-items: flex-start; flex-direction: column; }
  .hero, .grid, .proof-strip, .pain-grid, .steps { grid-template-columns: 1fr; }
  h1 { font-size: 42px; }
}
</style>
</head>
<body>
<header>
  <a class="brand" href="/">ThumbGate</a>
  <nav aria-label="Primary"><a href="/">Home</a><a href="/pricing">Pricing</a></nav>
</header>
<main>
  <h1>This offer has been retired</h1>
  <p>ThumbGate offers a free local CLI and self-serve Pro. Configure and validate your own workflow checks.</p>
  <p><a class="button" href="/install">Install the free CLI</a> <a href="/pricing">Compare current plans</a></p>
</main>
</body>
</html>
