<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">ThumbGate marketplace hero</title>
  <desc id="desc">Dark product banner showing ThumbGate blocking risky AI agent actions before execution.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset=".58" stop-color="#111827"/>
      <stop offset="1" stop-color="#052e2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <path d="M0 484 C210 414 330 552 540 476 C740 404 900 420 1280 332 L1280 640 L0 640 Z" fill="#0b3b3a" opacity=".42"/>
  <g transform="translate(80 80)" filter="url(#shadow)">
    <rect width="1120" height="480" rx="24" fill="#0b1020" stroke="#263244"/>
    <g transform="translate(44 42)">
      <rect width="70" height="70" rx="16" fill="url(#accent)"/>
      <path d="M35 15c12 0 21 9 21 21v8h10v11H45V44c0-5-4-9-10-9s-10 4-10 9v11H4V44h10v-8c0-12 9-21 21-21Z" fill="#0f172a" opacity=".82"/>
      <text x="94" y="30" fill="#f8fafc" font-family="Helvetica" font-size="34" font-weight="800">ThumbGate</text>
      <text x="94" y="64" fill="#a7f3d0" font-family="Helvetica" font-size="20">Pre-action checks for AI coding agents</text>
    </g>
    <g transform="translate(44 156)">
      <rect width="504" height="244" rx="18" fill="#111827" stroke="#334155"/>
      <text x="28" y="46" fill="#cbd5e1" font-family="Helvetica" font-size="20">Agent wants to run</text>
      <rect x="28" y="72" width="448" height="58" rx="10" fill="#020617" stroke="#475569"/>
      <text x="48" y="108" fill="#e2e8f0" font-family="Helvetica" font-size="20">git push --force main</text>
      <rect x="28" y="158" width="166" height="46" rx="10" fill="#7f1d1d"/>
      <text x="62" y="188" fill="#fecaca" font-family="Helvetica" font-size="18" font-weight="700">BLOCKED</text>
      <text x="216" y="188" fill="#94a3b8" font-family="Helvetica" font-size="18">matched: destructive git action</text>
    </g>
    <g transform="translate(620 150)">
      <rect width="440" height="72" rx="14" fill="#052e2b" stroke="#14b8a6"/>
      <circle cx="38" cy="36" r="15" fill="#22c55e"/>
      <text x="68" y="43" fill="#d1fae5" font-family="Helvetica" font-size="21" font-weight="700">Deterministic gates</text>
      <rect y="96" width="440" height="72" rx="14" fill="#172554" stroke="#38bdf8"/>
      <circle cx="38" cy="132" r="15" fill="#38bdf8"/>
      <text x="68" y="139" fill="#dbeafe" font-family="Helvetica" font-size="21" font-weight="700">Thumbs up/down memory</text>
      <rect y="192" width="440" height="72" rx="14" fill="#1e1b4b" stroke="#818cf8"/>
      <circle cx="38" cy="228" r="15" fill="#818cf8"/>
      <text x="68" y="235" fill="#e0e7ff" font-family="Helvetica" font-size="21" font-weight="700">MCP for VS Code forks</text>
    </g>
  </g>
</svg>
